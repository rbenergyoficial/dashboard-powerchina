name: Apagar blob (uso pontual, com confirmacao)

# Roda SO por dispatch manual e SO se a palavra de confirmacao vier certa.
# Existe porque apagar um blob de fora do CI exigiria credencial do storage em maquina, e credencial nao sai daqui.
# 🔐 SEM A CHAVE DA CONTA (plano OIDC, etapa 4, 26/10/2026): apaga pelo OIDC do proprio job (o papel no conteiner `dados`
#    ja inclui apagar); AZURE_CLIENT_ID e AZURE_TENANT_ID no env do passo, identificadores, nao credenciais.
#
# Uso: Actions -> este workflow -> Run workflow -> blob=way2_monitor.json, confirmar=APAGAR

on:
  workflow_dispatch:
    inputs:
      blob:
        description: 'Nome do blob no container dados (ex.: way2_monitor.json)'
        required: true
      confirmar:
        description: 'Escreva APAGAR para confirmar. Qualquer outra coisa aborta.'
        required: true
        default: 'nao'

permissions:
  contents: read
  id-token: write

concurrency:   # dois disparos do mesmo blob: o segundo espera, em vez de copiar junto e cair no delete (por branch, como os outros)
  group: apagar-blob-${{ github.ref }}-${{ inputs.blob }}
  cancel-in-progress: false

jobs:
  apagar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # O dispatch deixa escolher a branch na tela do Actions. Fora do main o Entra recusa a troca com um AADSTS que parece
      # credencial quebrada: este passo FALHA antes, dizendo a causa (falha, nao pula: `if:` que pula esconderia o vermelho).
      # A ref vem da variavel de ambiente, nunca interpolada no script: nome de branch com `$(...)` viraria comando.
      - name: So roda a partir do main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::este workflow so roda a partir do main: a credencial federada vale so para o main"
            exit 1
          fi
      - name: Conferir a palavra de confirmacao
        if: ${{ inputs.confirmar != 'APAGAR' }}
        run: |
          echo "Confirmacao ausente ou errada. Nada foi apagado."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
      - run: npm i @azure/storage-blob@12
      # A regra (copia em backup/ conferida byte a byte, snapshots junto, blob inexistente falha) mora no scripts/apagar-blob.js e
      # se julga antes, sem rede, no ensaio-apagar-blob.js (aqui e no ensaios.yml).
      - name: Ensaio · copia conferida antes de apagar (sem rede)
        run: node scripts/ensaio-apagar-blob.js
      - name: Apagar o blob (com copia em backup/ antes)
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          BLOB: ${{ inputs.blob }}
        run: node scripts/apagar-blob.js
