name: Apagar blob (uso pontual, com confirmacao)

# Roda SO por dispatch manual e SO se a palavra de confirmacao vier certa.
# Existe porque a connection string do storage e secret do Actions: apagar um blob de
# fora do CI exigiria a credencial em maquina, e credencial nao sai daqui.
#
# Uso: Actions -> este workflow -> Run workflow -> blob=way2_monitor.json, confirmar=APAGAR

on:
  workflow_dispatch:
    inputs:
      blob:
        description: 'Nome do blob no container dados (ex.: way2_monitor.json)'
        required: true
      confirmar:
        description: 'Escreva APAGAR para confirmar. Qualquer outra coisa aborta.'
        required: true
        default: 'nao'

concurrency:   # dois disparos do mesmo blob: o segundo espera, em vez de copiar junto e cair no delete
  group: apagar-blob-${{ inputs.blob }}
  cancel-in-progress: false

jobs:
  apagar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir a palavra de confirmacao
        if: ${{ inputs.confirmar != 'APAGAR' }}
        run: |
          echo "Confirmacao ausente ou errada. Nada foi apagado."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i @azure/storage-blob@12
      # Rede de seguranca: uma COPIA em backup/<nome>.<carimbo ISO UTC>, conferida byte a byte, e so entao o
      # apagamento. Snapshot nao serve: o Azure nao apaga blob que tem snapshot sem apagar o snapshot junto.
      # Os snapshots que ja existem (tentativas antigas deste workflow) tambem vao para backup/, como
      # backup/<nome>.snapshot-<carimbo>, antes do delete que os leva. Blob que nao existe FALHA: nome
      # digitado errado nao pode sair verde.
      - name: Apagar o blob (com copia em backup/ antes)
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          BLOB: ${{ inputs.blob }}
        run: |
          node -e '
          const { BlobServiceClient } = require("@azure/storage-blob");
          (async () => {
            const nome = process.env.BLOB;
            const cont = BlobServiceClient.fromConnectionString(process.env.DADOS_STORAGE).getContainerClient("dados");
            const bc = cont.getBlockBlobClient(nome);
            if (!(await bc.exists())) { console.error("blob nao existe: " + nome + ". Nada foi apagado."); process.exit(1); }
            const p = await bc.getProperties();
            console.log("apagando", nome, p.contentLength, "bytes, modificado em", p.lastModified);
            const copia = async (origem, destino) => {
              const buf = await origem.downloadToBuffer();
              const cp = cont.getBlockBlobClient(destino);
              await cp.uploadData(buf, { blobHTTPHeaders: { blobContentType: p.contentType, blobContentEncoding: p.contentEncoding } });
              const volta = await cp.downloadToBuffer();
              if (!volta.equals(buf)) throw new Error("a copia em " + destino + " nao confere com a origem. Nada foi apagado.");
              console.log("copia conferida:", destino, volta.length, "bytes");
            };
            const destino = "backup/" + nome + "." + new Date().toISOString().replace(/[:.]/g, "-");
            await copia(bc, destino);
            let snaps = 0;
            for await (const it of cont.listBlobsFlat({ prefix: nome, includeSnapshots: true })) {
              if (it.name !== nome || !it.snapshot) continue;
              await copia(bc.withSnapshot(it.snapshot), "backup/" + nome + ".snapshot-" + it.snapshot.replace(/[:.]/g, "-"));
              snaps += 1;
            }
            console.log("snapshots copiados:", snaps);
            await bc.delete({ deleteSnapshots: "include" });
            console.log("apagado. para voltar: copiar " + destino + " para " + nome + ".");
          })().catch(e => { console.error(e.message); process.exit(1); });
          '
