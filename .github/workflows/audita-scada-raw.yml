name: Audita scada-raw (so leitura, nao grava nada)
# Sem cron de proposito: e ferramenta de investigacao, roda quando alguem pergunta.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'vocab, stats (faixa de cada coluna), par (compara duas colunas) ou inv (quem existe no cabecalho do export de inversores)'
        required: false
        default: 'vocab'
      alvos:
        description: 'modo vocab: pedacos de nome de blob, separados por virgula'
        required: false
        default: ''
      par_a:
        description: 'modo par: pedaco do nome do arquivo A'
        required: false
        default: ''
      par_b:
        description: 'modo par: pedaco do nome do arquivo B'
        required: false
        default: ''
      par_col:
        description: 'modo par: pedaco do nome da coluna a comparar'
        required: false
        default: ''
concurrency:
  # por branch: um dispatch de outra branch (que falha na guarda do main) nao cancela nem desloca a fila do main
  group: audita-scada-raw-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audita:
    runs-on: ubuntu-latest
    # 🔐 SEM A CHAVE DA CONTA (plano OIDC, etapa 4, 26/10/2026). O passo que abre o storage leva o OIDC do proprio job: AZURE_CLIENT_ID
    #    e AZURE_TENANT_ID no env DO PASSO (identificadores, nao credenciais; as do relogio-deploy). `permissions` explicito zera
    #    o resto: `contents: read` e o que o checkout precisa.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    steps:
      # O dispatch deixa escolher a branch na tela do Actions. Fora do main o Entra recusa a troca com um AADSTS que parece
      # credencial quebrada: este passo FALHA antes, dizendo a causa (falha, nao pula: `if:` que pula esconderia o vermelho).
      # A ref vem da variavel de ambiente, nunca interpolada no script: nome de branch com `$(...)` viraria comando.
      - name: So roda a partir do main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::este workflow so roda a partir do main: a credencial federada vale so para o main"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: '20' }
      - run: npm i @azure/storage-blob@12
      - name: Auditar
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          RAW_CONTAINER: scada-raw
          MODO: ${{ github.event.inputs.modo }}
          ALVOS: ${{ github.event.inputs.alvos }}
          PAR_A: ${{ github.event.inputs.par_a }}
          PAR_B: ${{ github.event.inputs.par_b }}
          PAR_COL: ${{ github.event.inputs.par_col }}
        run: node scripts/audita-scada-raw.js
