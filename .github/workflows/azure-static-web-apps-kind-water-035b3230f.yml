name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
          # a guarda compara com o commit anterior; com fetch-depth 1 nao ha anterior
          fetch-depth: 2
      # 🔴 ANTES DE PUBLICAR, e nao num job paralelo. Um workflow separado ficaria vermelho DEPOIS
      # do site ja ter sido atualizado — que e exatamente o que nao adianta. Aqui a falha impede o
      # passo seguinte.
      #
      # Em 17/08/2026 uma copia de 28/06 foi publicada por cima e levou embora o comparativo SCADA,
      # o painel do ONS e o monitor. O site serviu a versao amputada por seis dias, sem nenhum job
      # vermelho: publicar MENOS nao e erro para ferramenta nenhuma.
      - uses: actions/setup-node@v4
        if: github.event_name == 'push'
        with: { node-version: '20' }
      - name: Guarda — o index.html nao pode encolher
        if: github.event_name == 'push'
        run: node scripts/guarda-index.js
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_WATER_035B3230F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_WATER_035B3230F }}
          action: "close"
