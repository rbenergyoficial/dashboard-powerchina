name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 55  # teto: 3x a maior duracao medida, com piso de 10 min (17,5 min, ultimas execucoes ate 23/10/2026); run presa sem teto tira o workflow do relogio
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
          # (a guarda do index.html, que comparava com o commit anterior, saiu com a aposentadoria)
          fetch-depth: 2
      # 🔴 SITE APOSENTADO em 18/10/2026 (decisao D1 do humano, lote pa-ociosos do plano de
      # desligar o Power Automate). O index.html da raiz era o unico leitor de cinco blobs que so o
      # Power Automate grava, e nada mais aponta para este endereco (varrido em 18/10: repositorio,
      # 97 dashboards do Grafana e o portal). Agora este endereco publica so o aviso da pasta
      # site-aposentado/, que leva ao Portal Corporativo e desinstala o service worker antigo.
      # O index.html antigo continua no repositorio; voltar e reverter o commit.
      # A guarda "o index.html nao pode encolher" saiu junto: ela protegia o site que nao e mais
      # publicado.
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_WATER_035B3230F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "site-aposentado" # so o aviso de endereco aposentado
          api_location: "" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10  # teto minimo: job curto que so roda ao fechar pull request; run presa sem teto tira o workflow do relogio
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_WATER_035B3230F }}
          action: "close"
