name: Comparativo -> cmp_*.json (ONS x Way2 x SCADA no mesmo balde)

# Roda DEPOIS das duas fontes que ele consome:
#   scada.yml          11:30 UTC  (08:30 BRT)  -> scada_comparativo.json e scada_5min.json
#   irradiancia-ons    ate 22:30 UTC           -> ons_irradiancia_<mes>.json
#
# Duas rodadas por dia: uma logo depois do SCADA, outra a noite, quando o ONS ja publicou o dia.
# O minuto quebrado e de proposito — no :00 o GitHub Actions atrasa de 30 a 90 min.
on:
  schedule:
    - cron: '40 13 * * *'   # 10:40 BRT, depois do SCADA das 08:30
    - cron: '40 23 * * *'   # 20:40 BRT, depois da ultima rodada do ONS
  workflow_dispatch:
    inputs:
      dias:
        description: 'quantos dias para tras reprocessar (carga inicial: 365)'
        required: false
        default: '7'
      resolucao:
        description: 'so uma resolucao: 5, 15, 30, 60, ou 0 para o diario (vazio = todas)'
        required: false
        default: ''
      forcar:
        description: 'sim = regrava mesmo sem mudanca'
        required: false
        default: 'nao'

# O CRON NAO PODE CANCELAR UMA CARGA HISTORICA. Mesma licao do MUST, em que o agendamento matou
# aos 12 minutos a recarga que corrigia o alinhamento e o historico ficou com o dado velho:
# o dispatch limpa a fila, o cron ESPERA.
concurrency:
  # por branch: um dispatch de outra branch (que falha na guarda do main) nao cancela nem desloca a fila do main
  group: gen-comparativo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    # 🔐 SEM A CHAVE DA CONTA (plano OIDC, etapa 4, 25/10/2026). Os passos que gravam levam o OIDC do proprio job: AZURE_CLIENT_ID e
    #    AZURE_TENANT_ID no env DO PASSO (identificadores, nao credenciais; as do relogio-deploy). Os ensaios que so leem o publicado
    #    levam a SAS de leitura; os sem rede ficam sem credencial nenhuma, de proposito. `permissions` explicito zera o resto:
    #    `contents: read` e o que o checkout precisa.
    permissions:
      contents: read
      id-token: write
    # A rodada diaria gasta pouco. O teto existe para a CARGA INICIAL, que percorre as quatro
    # janelas em blocos (11 dias por requisicao em 5 min, 138 em 1 hora).
    timeout-minutes: 90
    steps:
      # O dispatch deixa escolher a branch na tela do Actions. Fora do main o Entra recusa a troca com um AADSTS que parece
      # credencial quebrada: este passo FALHA antes, dizendo a causa (falha, nao pula: `if:` que pula esconderia o vermelho).
      # Vale para todo modo do workflow (ensaio e carga inclusive): fora do main nao ha credencial nenhuma.
      # A ref vem da variavel de ambiente, nunca interpolada no script: nome de branch com `$(...)` viraria comando.
      - name: So roda a partir do main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::este workflow so roda a partir do main: a credencial federada vale so para o main"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: '20' }
      - run: npm i @azure/storage-blob@12
      # O SCADA vira energia pelo trapezio entre amostras (10/10/2026); sem rede, julga as pecas que o gerador usa.
      - name: Ensaio · o SCADA do comparativo pelo trapezio (sem rede)
        run: node scripts/ensaio-comparativo-trapezio.js
      - name: Gerar cmp_*.json
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          WAY2_TOKEN: ${{ secrets.WAY2_TOKEN }}
          DIAS: ${{ inputs.dias || '7' }}
          SO: ${{ inputs.resolucao || '' }}
          FORCAR: ${{ inputs.forcar == 'sim' && '1' || '' }}
        run: node scripts/gen-comparativo.js
