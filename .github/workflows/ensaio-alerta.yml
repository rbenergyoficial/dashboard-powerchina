name: Ensaio do canal de alerta (manda UM e-mail de teste)

# 🔴 SO POR DISPATCH, nunca por cron. Ele manda um alerta de VERDADE pelos canais configurados,
# para provar o caminho de rede — que os outros ensaios nao tocam, porque rodam contra um GitHub
# simulado de proposito.
#
# Canal de alerta que nunca foi exercitado nao esta testado: o dia em que ele falhar sera o dia em
# que ele precisava funcionar. Este workflow existe para que esse dia nao seja o primeiro teste.
#
# ⚠️ O assunto diz "[ENSAIO — ignore]". Um alerta de ensaio parecido com um de verdade custa uma
#    ligacao de madrugada.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # o canal de e-mail usa OIDC — sem isto ele responde FALHOU e o ensaio reprova, que e o certo
  id-token: write

jobs:
  ensaiar:
    runs-on: ubuntu-latest
    # 🔐 sem credencial do storage: nenhum script deste job le nem grava o storage (so falam com a API de fora). Nem a chave
    #    da conta nem a SAS de leitura: credencial que o job nao usa nao fica exposta a ele.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: '20' }
      - name: Mandar um alerta de teste
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          AZ_MAIL_TENANT_ID: ${{ vars.AZ_MAIL_TENANT_ID }}
          AZ_MAIL_CLIENT_ID: ${{ vars.AZ_MAIL_CLIENT_ID }}
          MAIL_DE: ${{ vars.MAIL_DE }}
          MAIL_PARA: ${{ vars.MAIL_PARA }}
        run: node scripts/ensaio-canal-email.js
