name: Ensaio MUST · geradores em modo local, nada publicado

# Roda gen-must.js e gen-must-intra.js com LOCAL_OUT apontando para um diretorio do runner.
# NADA vai para o Azure. Depois confere os arquivos produzidos: rotulo de tempo pelo FIM do
# intervalo, granularidade prometida, e se sobrou alguma ultrapassagem nos dias auditados —
# onde a resposta correta, medida na fonte, e ZERO.
#
# Existe porque a correcao do alinhamento muda o numero que a pagina publica. Subir direto e
# conferir depois seria descobrir o defeito na tela, que e o que este projeto evita.
on:
  workflow_dispatch:
    inputs:
      dias:
        description: 'quantos dias processar no ensaio'
        required: false
        default: '25'
      dias_alvo:
        description: 'dias com ultrapassagem a reconferir'
        required: false
        default: '2026-08-03,2026-08-07,2026-08-11'
jobs:
  ensaio:
    runs-on: ubuntu-latest
    env:   # 🔐 so LE o `dados` (nenhum script deste job grava): a SAS de leitura (DADOS_LEITURA, revogavel), nao a chave da conta
      DADOS_SAS: ${{ secrets.DADOS_LEITURA }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: '20' }
      # a leitura do `dados` vai pela SAS de leitura (https, sem o SDK); o pacote fica porque os geradores carregam a
      # lib-conteiner, que pede o SDK ao abrir um conteiner (com LOCAL_OUT eles nao chegam a abrir). O must-intra.yml instala igual.
      - run: npm i @azure/storage-blob@12
      - run: mkdir -p /tmp/ensaio
      - name: gen-must-intra em modo local
        env:
          WAY2_TOKEN: ${{ secrets.WAY2_TOKEN }}
          LOCAL_OUT: /tmp/ensaio/
          DIAS: ${{ inputs.dias || '25' }}
          FORCAR: '1'
        run: node scripts/gen-must-intra.js
      # 🔴 O gerador passou a publicar os DOIS sentidos do medidor. A media diaria nao pega
      # canal trocado; este confere por LINHA e por JANELA, que e onde a assinatura solar aparece.
      - name: Conferir os canais de geracao e consumo
        env:
          LOCAL_OUT: /tmp/ensaio/
        run: node scripts/confere-must-canais.js
      - name: gen-must em modo local
        env:
          WAY2_TOKEN: ${{ secrets.WAY2_TOKEN }}
          LOCAL_OUT: /tmp/ensaio/must_diario.json
          DIAS: ${{ inputs.dias || '25' }}
          FORCAR: '1'
        run: node scripts/gen-must.js
      - name: Conferir o que saiu
        env:
          ENSAIO_DIR: /tmp/ensaio/
          DIAS_ALVO: ${{ inputs.dias_alvo || '2026-08-03,2026-08-07,2026-08-11' }}
        run: node scripts/audita-must-ensaio.js
