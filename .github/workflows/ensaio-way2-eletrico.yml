name: Ensaio · Way2 Eletrico (gera em arquivo, sem publicar)

# Este ensaio NAO grava nada em producao: roda o gerador da coleta de 5 min da Way2 (gen-way2-eletrico) e grava a saida
# em arquivo, que sobe como artefato para inspecao. Sem credencial do storage: o modo local nao le nem grava o conteiner.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'local (grava em arquivo e sobe como artefato)'
        type: choice
        options: [local]
        default: local

concurrency:
  group: ensaio-way2-eletrico
  cancel-in-progress: false

jobs:
  ensaio:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # teto: 3x a maior duracao medida, com piso de 10 min (0,5 min, ultimas execucoes ate 23/10/2026); run presa sem teto tira o workflow do relogio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: '20' }

      # Mesma instalacao dos demais workflows do repo: nao ha package.json aqui, entao
      # a dependencia e nomeada e fixada na versao. Copiado do must.yml, nao inventado.
      - run: npm i @azure/storage-blob@12

      - name: Gerar em arquivo (sem tocar em producao)
        if: ${{ inputs.modo == 'local' }}
        env:
          WAY2_TOKEN: ${{ secrets.WAY2_TOKEN }}
          LOCAL_OUT: way2_eletrico.ensaio.json
        run: |
          node scripts/gen-way2-eletrico.js
          ls -lh way2_eletrico.ensaio.json

      - name: Guardar a saida do ensaio
        if: ${{ inputs.modo == 'local' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: way2-eletrico-ensaio
          path: way2_eletrico.ensaio.json
          retention-days: 3
