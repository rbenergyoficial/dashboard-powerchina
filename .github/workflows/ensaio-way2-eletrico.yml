name: Ensaio · Way2 Eletrico (compara o gerador com o fluxo, sem publicar)

# Este ensaio NAO grava nada. `comparar` busca da API da Way2 pelo gerador e compara com o
# way2_eletrico.json publicado, que o proprio gerador grava no way2-recent.yml de 5 em 5 min: diz se a
# coleta de agora cobre o que ja esta no ar, nao prova a regra do gerador. `local` grava em arquivo e
# sobe como artefato, para inspecao.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'comparar (nao grava) | local (grava em arquivo e sobe como artefato)'
        type: choice
        options: [comparar, local]
        default: comparar

concurrency:
  group: ensaio-way2-eletrico
  cancel-in-progress: false

jobs:
  ensaio:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # teto: 3x a maior duracao medida, com piso de 10 min (0,5 min, ultimas execucoes ate 23/10/2026); run presa sem teto tira o workflow do relogio
    env:   # Fase 2 (PROMOVER fase2-virada): toda leitura de `dados` pela lib-le-dados com credencial, em todo passo do job
      DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: '20' }

      # Mesma instalacao dos demais workflows do repo: nao ha package.json aqui, entao
      # a dependencia e nomeada e fixada na versao. Copiado do must.yml, nao inventado.
      - run: npm i @azure/storage-blob@12

      - name: Comparar gerador x fluxo
        if: ${{ inputs.modo == 'comparar' }}
        env:
          WAY2_TOKEN: ${{ secrets.WAY2_TOKEN }}
          COMPARAR: '1'
        run: node scripts/gen-way2-eletrico.js

      - name: Gerar em arquivo (sem tocar em producao)
        if: ${{ inputs.modo == 'local' }}
        env:
          WAY2_TOKEN: ${{ secrets.WAY2_TOKEN }}
          LOCAL_OUT: way2_eletrico.ensaio.json
        run: |
          node scripts/gen-way2-eletrico.js
          ls -lh way2_eletrico.ensaio.json

      - name: Guardar a saida do ensaio
        if: ${{ inputs.modo == 'local' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: way2-eletrico-ensaio
          path: way2_eletrico.ensaio.json
          retention-days: 3
