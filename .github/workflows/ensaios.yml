name: Ensaios de logica (a cada push em scripts/)

# Ensaios que julgam a REGRA de um vigia, de uma guarda ou da intake, e nao o dado do dia. Ate
# 26/09/2026 estes ensaios nao rodavam em workflow nenhum e dependiam de alguem lembrar de rodar.
#
# O `ensaio-liquidada.js` ficou fora no primeiro lote (estourava no comeco do mes) e entrou em 03/10/2026, ja so com
# casos plantados: a guarda da liquidada e julgada aqui como LOGICA, verde em qualquer dia; o estado da janela publicada
# e julgado depois do gerador, no executivo.yml (ensaio-liquidada-produto.js).
#
# Por que num workflow proprio, e nao nos workflows de dado: e no PUSH que um ensaio de logica pode
# reprovar (e quando o codigo muda); e ha ensaio que le blob publico, entao num job de 5 ou 15 min um
# estranhamento do dado travaria a publicacao. O GitHub e o canal de alerta sao SIMULADOS dentro dos
# ensaios, e os geradores rodam com saida local. A unica credencial e a de LEITURA do conteiner `dados`
# (DADOS_LEITURA, SAS de politica revogavel): um ensaio que tentasse gravar em producao falha.
#
# ⚠️ Cada passo roda com `if: always()`: um ensaio vermelho nao esconde o resultado dos outros.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/ensaios.yml'
      # a fiacao da copia do historico do medidor nesses tres e julgada aqui (ensaio-le-blob, item 9), e so aqui para o executivo
      - '.github/workflows/executivo.yml'
      - '.github/workflows/way2-agg.yml'
      - '.github/workflows/way2-recent.yml'
      - '.github/workflows/trafo-medidor.yml'   # trafo-alvo-ensaio (24/10/2026): a fiacao da copia do supervisorio
      - '.github/workflows/oleo.yml'   # plano OIDC, etapa 3 (25/10/2026): a fiacao sem a chave (ensaio-lib-conteiner, MIGRADOS)
      - '.github/workflows/must.yml'              # plano OIDC, etapa 4: a mesma fiacao
      - '.github/workflows/irradiancia-ons.yml'
      - '.github/workflows/sager-disp.yml'
      - '.github/workflows/way2-mes.yml'          # plano OIDC, etapa 4, grupo 2: a mesma fiacao
      - '.github/workflows/vigia.yml'
      - '.github/workflows/ons-consolidado.yml'   # plano OIDC, etapa 4, grupo 3: a mesma fiacao
      - '.github/workflows/portal-dia.yml'
      - '.github/workflows/inversores.yml'
      - '.github/workflows/estacao-logger.yml'
      - '.github/workflows/render-paineis.yml'
      - '.github/workflows/ppc.yml'
      - '.github/workflows/comparativo.yml'
      - '.github/workflows/must-intra.yml'   # plano OIDC, etapa 4, grupo 4: a mesma fiacao
      - '.github/workflows/eneat-intradia-way2.yml'
      - '.github/workflows/inv-scada.yml'
      - '.github/workflows/perdas.yml'
      - '.github/workflows/audita-scada-raw.yml'   # plano OIDC, etapa 4, auditorias e ensaios avulsos
      - '.github/workflows/benchmark-2025.yml'
      - '.github/workflows/audita-must.yml'
      - '.github/workflows/audita-way2-grandezas.yml'
      - '.github/workflows/ensaio-alerta.yml'
      - '.github/workflows/ensaio-comparativo.yml'
      - '.github/workflows/ensaio-must.yml'
      - '.github/workflows/way2-hist.yml'   # plano OIDC, etapa 4, os grandes diarios
      - '.github/workflows/scada.yml'
      - '.github/workflows/sungrow.yml'   # custo-sungrow (24/10/2026): a fiacao da copia dos exports do SCADA (ensaio-cache-blob, item 12)
      - '.github/workflows/trafo.yml'   # a fiacao da copia do bruto do supervisorio (ensaio-cache-blob, item 12)
      - '.github/workflows/malha-estado.yml'   # plano OIDC, etapa 4, os dois ultimos: a mesma fiacao
      - '.github/workflows/apagar-blob.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ensaios-logica
  cancel-in-progress: true

jobs:
  ensaiar:
    runs-on: ubuntu-latest
    env:   # leitura de `dados` pela lib-le-dados com a SAS so de leitura; nenhum passo deste job tem a chave da conta
      DADOS_SAS: ${{ secrets.DADOS_LEITURA }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: '20' }
      # os geradores julgados importam o cliente do Azure no topo, mesmo sem usa-lo no modo local
      - run: npm i @azure/storage-blob@12

      - name: Ensaio · canal de alerta abre, comenta, fecha e deduplica (lib-alerta)
        if: always()
        run: node scripts/ensaio-lib-alerta.js

      # A leitura condicional do historico do medidor (lib-le-blob) e a fiacao de TODOS os geradores que a usam. Nos workflows de
      # producao (way2-agg, way2-recent) roda so a parte de cada um: um lote que mexe no gen-pr nao congela o agregado nem o ao vivo.
      - name: Ensaio · a leitura condicional do historico do medidor (lib-le-blob, todos os geradores)
        if: always()
        run: node scripts/ensaio-le-blob.js

      # 💰 A copia do scada-raw entre execucoes (10/10/2026) so vale quando confere com a listagem, e nunca esconde
      #    falha de download. Container simulado, sem rede; confere tambem que os tres geradores passam por ela.
      - name: Ensaio · a copia em disco do bruto (lib-cache-blob)
        if: always()
        run: node scripts/ensaio-cache-blob.js

      # A saida propria pela copia em disco: o GET condicional da lib-le-dados para os nomes do padrao, a copia so
      # com o 304 do storage, o escritor que lembra a etag do upload e a fiacao no sungrow.yml; sem as variaveis, nada muda.
      - name: Ensaio · a saida propria pela copia em disco (lib-le-dados)
        if: always()
        run: node scripts/ensaio-saidas-proprias.js

      # A porta unica para o storage (lib-conteiner, plano OIDC etapa 2, 25/10/2026): a chave como sempre; sem credencial estoura
      # nomeando o que falta; a chave vence o OIDC; a troca do token do GitHub pelo do Entra, guardado e renovado a 5 min do fim;
      # e a lib-le-dados lendo pelo SDK com o OIDC, contra um servidor https local. Sem segredo e sem rede de fora.
      - name: Ensaio · a porta unica para o storage, com a chave ou o OIDC (lib-conteiner)
        if: always()
        run: node scripts/ensaio-lib-conteiner.js

      # O SCADA do comparativo vira energia pelo trapezio entre amostras, e a meia hora so sai completa (10/10/2026).
      - name: Ensaio · o SCADA do comparativo pelo trapezio
        if: always()
        run: node scripts/ensaio-comparativo-trapezio.js

      # O supervisorio lido do BANCO (lote scada-db, 22/10/2026): soma pelo unifilar, tudo-ou-nada por intervalo, o zip mais novo,
      # o RTC do M3, o banco vence a planilha so no dia completo, so a extracao da reta entra, e o vigia do banco (D+2 12:00 BRT).
      # Zips sinteticos e o gerador de verdade em processo filho; cada regra com o seu plantio. No scada.yml roda antes do gerador.
      - name: Ensaio · o SCADA pelo banco do supervisorio e o vigia dele (lib-scada-db, gen-scada, gen-scada-db-vigia)
        if: always()
        run: |
          npm i --no-save xlsx@0.18.5
          node scripts/ensaio-scada-db.js

      - name: Ensaio · o apagar-blob copia e confere antes de apagar
        if: always()
        run: node scripts/ensaio-apagar-blob.js

      - name: Ensaio · os quatro eventos do vigia da Way2 deduplicam e fecham
        if: always()
        run: node scripts/ensaio-way2-watchdog-canal.js

      # O vigia de resultado e de cadencia (lib-vigia.js): execucao em andamento nao fecha alarme, o ultimo sucesso nao
      # volta no tempo, o nao lido e o pendente mantem o estado (11/10/2026). Casos, plantios e o proprio vigia rodando
      # com o GitHub, o alerta e o blob forjados. E no push que a regra muda; no vigia.yml ele roda de novo antes de vigiar.
      - name: Ensaio · o vigia nao se desmente (lib-vigia)
        if: always()
        run: node scripts/ensaio-vigia-resultado.js

      # O portao do corte por gemeo julga so meses FECHADOS (lib-portao-gemeo.js, 11/10/2026): numeros reais da rodada que
      # reprovou com o mes em curso a -42 %, bordas e plantios. No ons-consolidado.yml ele roda de novo antes do gemeo.
      - name: Ensaio · o portao do gemeo julga so meses fechados (lib-portao-gemeo)
        if: always()
        run: node scripts/ensaio-portao-gemeo.js --lib

      - name: Ensaio · o vigia da intake do SCADA reprova quando deve
        if: always()
        run: node scripts/ensaio-scada-intake-watchdog.js

      - name: Ensaio · a intake do scada-raw reprova o nome sem prefixo
        if: always()
        run: node scripts/ensaio-scada-intake.js

      # ⚠️ Este le o must_5min.json publicado e roda o vigia com LOCAL_OUT. Ele sai 0 quando os quatro
      #    cenarios RODAM; o texto do alerta de cada um fica no log para leitura. Nao e asserção.
      - name: Ensaio · o vigia de MUST nos quatro cenarios (recortes reais de 23/08/2026)
        if: always()
        run: node scripts/ensaio-must-watchdog.js   # le must_5min.json e way2_watchdog.json com a SAS de leitura do job

      # O alerta de ultrapassagem do MUST no quarto de hora (alerta-must.js): janela por dia BRT,
      # fronteira do balde das 00:00, dedup, e vermelho quando o canal esta incompleto ou nada foi julgado. So casos
      # fabricados; o mesmo ensaio roda tambem antes do alerta no must-intra.yml, e o alerta so roda se ele passar.
      - name: Ensaio · o alerta de ultrapassagem do MUST (15 min)
        if: always()
        run: node scripts/ensaio-alerta-must.js

      # O gerador do MUST intradiario (gen-must-intra.js, PROMOVER must-gerador) EXECUTADO num processo a parte, com a Way2, o
      # blob e o relogio forjados: o provisorio da Way2 (qualidade 2) nao entra, ontem e relido depois da meia-noite enquanto
      # incompleto, a guarda de grade, e o valor revisado regrava o blob. Nada sai do runner.
      - name: Ensaio · o gerador do MUST intradiario
        if: always()
        run: node scripts/ensaio-gen-must-intra.js

      # O mes corrente do ONS (repara-ons-mes.js, gravarMesCorrente) no formato do blob mensal: texto cru, so o dsc aparado, mes em UTC, topo do blob igual, e nunca piorar o que esta gravado.
      - name: Ensaio · o mes corrente do ONS no formato do fluxo
        if: always()
        run: node scripts/ensaio-ons-mes-corrente.js

      # A leitura do conteiner `dados` com credencial (lib-le-dados.js; Fase 2): SDK, SAS e publico; so o 404 BlobNotFound e
      # "nao existe", o anonimo no conteiner privado e a conta fechada ESTOURAM.
      - name: Ensaio · leitura do conteiner dados (lib-le-dados)
        if: always()
        run: node scripts/ensaio-le-dados.js

      # O estado da malha de dados para o portal admin (gen-malha-estado.js, lote malha-estado): a tabela do contrato, o
      # estado sem registro que nao vira ok, o teste que nao vence o diario, nada do log da ponte nem nome de conteiner/blob
      # na saida, prazo da agenda e 404 de conteiner que estoura. O mesmo ensaio roda antes do gerador no malha-estado.yml.
      - name: Ensaio · o estado da malha de dados (gen-malha-estado)
        if: always()
        run: node scripts/ensaio-malha-estado.js

      # A energia e a demanda do mes da Way2 (gen-way2-mes.js): as tres
      # chamadas, a guarda de forma, a comparacao ponto x dia (hoje e ontem vivos) e o corpo gravado exato.
      - name: Ensaio · energia e demanda do mes da Way2 (substituto do fluxo)
        if: always()
        run: node scripts/ensaio-way2-mes.js

      # A guarda da EneatLiquida (lib-guarda-liquida.js) pela mesma funcao que o gen-executivo usa: o dia julgado nao
      # entra no proprio teto, sem catraca, comeco de mes decidido pela janela guardada, aceito pelo sinal nao vai para a
      # janela. So dados plantados.
      - name: Ensaio · a guarda da EneatLiquida reprova liquidacao incompleta (logica)
        if: always()
        run: node scripts/ensaio-liquidada.js

      # A fusao do registro da mesa (lib-ppc.js · fundeCopias): a copia mais nova manda nos dias que cobre, inclusive
      # para apagar linha corrigida; o historico antes do arquivo e a manha do primeiro dia ficam. So dados plantados.
      - name: Ensaio · a fusao das copias da planilha da mesa tira a linha corrigida
        if: always()
        run: node scripts/ensaio-ppc-funde.js

      # A ponte dos inversores (coleta-inversores.js, lote pa-inversores), substituto do fluxo "Inversores PWC -> Blob -> Grafana".
      # Ela roda na maquina do operador; aqui se julga a regra com contêiner forjado: nome cru do fluxo, comparacao por SHA-256
      # contra o contêiner, SECO por padrao, envio condicional, ZIP inteiro e o codigo de saida do script, com 21 plantios.
      - name: Ensaio · a ponte dos inversores sobe so o que mudou, com o nome do fluxo (coleta-inversores)
        if: always()
        run: |
          npm i --no-save xlsx@0.18.5
          node scripts/ensaio-coleta-inversores.js

      # As duas pontes da maquina (coleta-inversores, coleta-ppc) sem a chave da conta (lote coleta-sem-chave, 28/10/2026): o token da
      # sessao local do az, renovado a 5 min do fim, nunca impresso, sem volta para a chave; az simulado, 17 casos e 7 plantios.
      - name: Ensaio · as pontes da maquina gravam com o token da sessao, sem a chave (lib-sessao-az)
        if: always()
        run: node scripts/ensaio-lib-sessao-az.js

      # Os alarmes dos medidores (lote alarmes-way2, 28/10/2026) e, sem rede, quais meses o gerador dos alarmes do supervisorio refaz
      # (lote alarmes-scada, 29/10/2026; a regra dele le o cofre e roda no alarmes-scada.yml). A REGRA do circuito aberto / sem tensao sobre 4 dias REAIS do
      # historico do medidor (21/09: o 04T2 desligado pelo SEP; 27/10: dois cubiculos abertos; 01/01/2026: corte a zero; 29/01/2026: a
      # reenergizacao com a rede aberta a jusante) e os forjados, com 13 plantios; e o GERADOR em quatro rodadas seguidas (a semente
      # do publicado, a virada do dia, o inicio que muda, a poda da janela), com 6 plantios. Dia fixo que sumiu do historico reprova.
      - name: Ensaio · alarmes dos medidores (regra nos dias reais e gerador)
        if: always()
        run: |
          node scripts/ensaio-alarme-circuito.js
          node scripts/ensaio-gen-alarmes-way2.js
          node scripts/ensaio-gen-alarmes-scada.js
