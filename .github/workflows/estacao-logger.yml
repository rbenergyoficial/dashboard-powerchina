name: Estacoes solarimetricas (datalogger) -> estacao_logger_30min.json, estacao_dia.json e estacao_10min_M<usina>.json
on:
  schedule:
    - cron: '23 8 * * *' # 05:23 BRT — o arquivo do dia chega ao computador as 02:00 e sobe ao backup-dados-scada as 04:00
    - cron: '33 15 * * *' # 12:33 BRT — segunda rodada: o backup do PC roda tambem as 12:00 (quando dorme as 04:00, ou o arquivo sincroniza depois)
  workflow_dispatch:
concurrency:
  # por branch: um dispatch de outra branch (que falha na guarda do main) nao cancela nem desloca a fila do main
  group: gen-estacao-logger-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-latest
    # 🔐 SEM A CHAVE DA CONTA (plano OIDC, etapa 4, 25/10/2026). Os passos que gravam levam o OIDC do proprio job: AZURE_CLIENT_ID e
    #    AZURE_TENANT_ID no env DO PASSO (identificadores, nao credenciais; as do relogio-deploy). Os ensaios que so leem o publicado
    #    levam a SAS de leitura; os sem rede ficam sem credencial nenhuma, de proposito. `permissions` explicito zera o resto:
    #    `contents: read` e o que o checkout precisa.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      # O dispatch deixa escolher a branch na tela do Actions. Fora do main o Entra recusa a troca com um AADSTS que parece
      # credencial quebrada: este passo FALHA antes, dizendo a causa (falha, nao pula: `if:` que pula esconderia o vermelho).
      # Vale para todo modo do workflow (ensaio e carga inclusive): fora do main nao ha credencial nenhuma.
      # A ref vem da variavel de ambiente, nunca interpolada no script: nome de branch com `$(...)` viraria comando.
      - name: So roda a partir do main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::este workflow so roda a partir do main: a credencial federada vale so para o main"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: '20' }
      - run: npm i @azure/storage-blob@12
      # campo pelo nome, meia hora T = media de T+10, T+20 e T+30 (tudo-ou-nada), M10 = usina 1, duplicados e 3 s fora; com plantios
      - name: Ensaio · leitura do datalogger e a meia hora (sem rede)
        run: node scripts/ensaio-estacao-logger.js
      # todas as grandezas (lib-estacao-tudo, estacao-tudo): campo pelo nome, dia pelo rotulo do fim, irradiacao x 1/6 h, albedo e modulo e sujeira
      # so com sol, vento no teto e faixa fisica fora das contas, direcao vetorial, noite, 10 min recente; com plantios
      - name: Ensaio · todas as grandezas do datalogger (sem rede)
        run: node scripts/ensaio-estacao-tudo.js
      # lote fonte-pr-logger: a solarimetria inteira em meia hora (estacao_tudo_30min.json, lib-estacao-30min), que o gen-irradiancia
      # le para as telas e o PR: media das tres medias de 10 min, tudo-ou-nada; com plantios (amostra, incompleta, chuva, direcao)
      - name: Ensaio · a solarimetria do datalogger em meia hora (sem rede)
        run: node scripts/ensaio-irr-datalogger.js --lib
      # 💰 ~4 mil arquivos de 128 KB: so o arquivo novo vem pela rede (lib-cache-blob.js); cache proprio deste workflow
      - name: Restaurar a copia do backup-dados-scada
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .cache-blob
          key: backup-dados-scada-estacao-${{ github.run_id }}
          restore-keys: backup-dados-scada-estacao-
      - name: Gerar estacao_logger_30min.json, estacao_tudo_30min.json, estacao_dia.json e estacao_10min_M<usina>.json
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          RAW: backup-dados-scada
          PREFIXO: Estacao_Meteorologica_Logger/
          OUT: dados
          CACHE_BLOB_DIR: ${{ github.workspace }}/.cache-blob
        run: node scripts/gen-estacao-logger.js
      - name: Guardar a copia do backup-dados-scada
        if: ${{ !cancelled() && hashFiles('.cache-blob/**/*.meta') != '' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .cache-blob
          key: backup-dados-scada-estacao-${{ hashFiles('.cache-blob/**/*.meta') }}
      # PROMOVER assistente-portal: o resumo diario do Assistente Inteligente (agente_dia.json) refeito com o dado novo deste workflow;
      # roda mesmo se um ensaio anterior reprovou (le os blobs publicados), e o ensaio dele refaz cada numero por codigo proprio
      - name: Ensaio · resumo do dia do assistente (lib, mundo forjado)
        id: agente_lib
        if: ${{ !cancelled() }}
        run: node scripts/ensaio-agente-dia.js --lib
      - name: Agente · resumo do dia do assistente
        id: agente_dia
        if: ${{ !cancelled() && steps.agente_lib.outcome == 'success' }}
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          FONTES_DIR: ${{ runner.temp }}/agente_dia_fontes
        run: node scripts/gen-agente-dia.js
      - name: Ensaio · resumo do dia do assistente (produto)
        if: ${{ !cancelled() && steps.agente_dia.outcome == 'success' }}
        env:
          FONTES_DIR: ${{ runner.temp }}/agente_dia_fontes   # as fontes que o gerador deste job leu e o produto que ele gravou
          DADOS_SAS: ${{ secrets.DADOS_LEITURA }}   # so le o publicado: a SAS de leitura (revogavel), nao o OIDC que grava
        run: node scripts/ensaio-agente-dia.js
