name: Executivo -> executivo.json (visao executiva)
on:
  schedule:
          - cron: '13 4,9-22 * * *' # 01h BRT (fecha o dia anterior) + 06h-19h BRT · min 13 foge do congestionamento do :00
  workflow_dispatch: {}
concurrency:
  group: gen-executivo
  cancel-in-progress: true
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i @azure/storage-blob@12

      # ANTES de gerar, e de proposito: regra quebrada nao pode chegar ao blob. Ele julga a REGRA em
      # casos FORJADOS (nao o arquivo do dia), entao vale em qualquer estado do mundo — a licao do
      # ensaio que reprovava porque o conserto tinha funcionado.
      - name: Ensaio · o selo "ao vivo ate" aponta para o instante mais recente
        run: node scripts/ensaio-aovivo.js

      # A folga do par MWh x GWh no rateio e DERIVADA da cadeia de arredondamento. Afrouxar
      # tolerancia e o jeito mais facil de apagar um alarme: este ensaio cobra que ela continue
      # pegando os quatro defeitos plantados enquanto para de reprovar arredondamento.
      - name: Ensaio · a tolerancia do rateio cobre o arredondamento e ainda pega defeito
        run: node scripts/ensaio-tol-rateio.js

      # A conta dos campos da manchete que se movem no dia mora numa lib que o executivo e o remendo
      # de 5 min chamam. Este ensaio cobra que eles andem JUNTOS (energia) e que a projecao, que
      # parte dos dias fechados, fique PARADA — e que o mes fechado nao seja tocado.
      - name: Ensaio · o remendo move a manchete inteira, e coerente
        run: node scripts/ensaio-manchete-remendo.js

      # ... e que, de noite, com a ancora que ja contem o dia, o remendo nao conte o dia duas vezes (a regra, antes de gerar)
      - name: Ensaio · o remendo nao conta o dia duas vezes (regra)
        run: node scripts/ensaio-manchete-noite.js --lib

      # A leitura de irradiancia TRAVADA sai da meia hora e da hora da estacao (23/09/2026: a estacao do M5 repetiu 0,26 W/m2
      # das 05:00 as 11:30 e o PR do conjunto saiu 79,92 %). A REGRA, em casos forjados, antes de gerar qualquer coisa.
      - name: Ensaio · a leitura travada sai da serie (regra)
        run: node scripts/ensaio-irr-travada.js --lib

      # O historico da projecao (meta, gerado e o que a projecao diria com 5..25 dias fechados, por mes fechado) e o
      # registro do que a manchete publicou: a REGRA, em casos forjados, antes de gerar.
      - name: Ensaio · o historico da projecao (regra)
        run: node scripts/ensaio-historico-projecao.js --lib

      # O PR por usina e por contrato (energia dos circuitos, irradiacao da estacao da usina, placa CC dela): a REGRA,
      # em casos forjados, antes de gerar.
      - name: Ensaio · o PR por usina e por contrato (regra)
        run: node scripts/ensaio-pr-ufv.js --lib

      - name: Gerar benchmark_ne.json (corte do NE, solar e eolico)
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          OUT_CONTAINER: dados
          # jan/26 em diante — referencia de todas as analises do painel executivo. Le ~390 MB dos
          # dados abertos do ONS em streaming e grava so o resumo mensal (alguns KB).
        run: node scripts/gen-benchmark-ons.js

      - name: Gerar executivo.json
        id: gen_exec
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          OUT_CONTAINER: dados
          OUT_BLOB: executivo.json
        run: node scripts/gen-executivo.js

      # Segunda rota sobre o PRODUTO publicado: os dois geradores ja abortam sem gravar quando a soma
      # dos dias nao reproduz o mes, mas eles conferem os acumuladores CRUS, em memoria. Aqui se
      # confere o que o painel de fato le, ja arredondado — e o ensaio prova que reprova, plantando
      # defeitos em copias sadias dos proprios blobs.
      - name: Ensaio · a serie por dia fecha com a por mes
        run: node scripts/ensaio-fechamento-dia.js

      # A relacao usina -> contrato passou a ser publicada para os paineis pararem de carrega-la como
      # literal em onze lugares. Mapa errado nao quebra tela nenhuma: faz o painel APAGAR a entidade
      # errada da selecao, em silencio. Por isso o ensaio nao se contenta com coerencia interna — ele
      # cobra que a soma das partes de cada contrato bata com o contrato PUBLICADO, em todo mes
      # fechado. Roda DEPOIS de gerar, como os outros que julgam o produto.
      - name: Ensaio · a hierarquia publicada fecha com a energia
        run: node scripts/ensaio-hierarquia.js

      # O corte diario passou a ser publicado tambem ABERTO POR USINA, a pedido. As duas escritas saem
      # do MESMO laco, entao fecham por construcao — e "por construcao" e o que envelhece calado quando
      # alguem mexe num lado so. Divergir aqui poria o painel por usina e o por contrato dizendo numeros
      # diferentes sobre o MESMO dia. Roda DEPOIS de gerar, como os outros que julgam o produto.
      - name: Ensaio · o corte por usina fecha com o corte por contrato
        run: node scripts/ensaio-corte-ufv.js

      # A referencia do operador contra a verificada, crua, dia a dia. O campo existe para MOSTRAR um defeito da
      # fonte, entao tem de provar que e cru: cada usina contra o arquivo mensal do operador (o gerador ja fecha o
      # conjunto contra o arquivo do conjunto), e os agregados contra as suas partes.
      - name: Ensaio · a referencia do operador por usina e a crua
        run: node scripts/ensaio-ref-dia.js

      # Corte, potencial, entregue, resto e razoes do mes tambem em MWh, da energia crua (o GWh de 2 casas so tem
      # 10 MWh de resolucao, e o portal escreve MWh com 2 casas). O gerador ja confere antes de gravar; este e a
      # segunda rota, sobre o PRODUTO publicado, e prova reprovar em quatro defeitos plantados.
      - name: Ensaio · o par GWh x MWh do executivo fecha
        run: node scripts/ensaio-par-mwh.js

      # A manchete do mes (meta, projecao, falta, ritmos) tambem em MWh com centesimos, das energias em MWh da serie:
      # origem, identidades, o remendo de 5 min movendo os campos em MWh, e dois plantios que reprovam.
      - name: Ensaio · a manchete em MWh
        run: node scripts/ensaio-manchete-mwh.js

      # A energia do mes na manchete e a soma dos dias da serie (o remendo de 5 min contou o dia 28/09 duas vezes depois do
      # por do sol). Aqui, o produto da rodada completa; no way2-recent, o de cada remendo.
      - name: Ensaio · a manchete nao conta o dia duas vezes (produto)
        run: node scripts/ensaio-manchete-noite.js --produto

      # A serie mensal e a manchete dizem a MESMA coisa sobre o mes estar aberto: em 30/09/2026, ultimo dia do mes, a serie
      # deu set/26 por fechado de manha (o fator do rateio vira 1) enquanto a manchete dizia 1 dia restante.
      - name: Ensaio · a serie mensal e a manchete concordam sobre o mes aberto
        run: node scripts/ensaio-mes-aberto.js

      # O atingimento do mes aberto sai do MWh, e o do conjunto e o do Complexo (em 01/10/2026, pelo GWh de 2 casas, o M9
      # publicava 77,78 % contra 77,20 % exatos). Sem mes aberto, so os plantios forjados.
      - name: Ensaio · o atingimento do mes aberto sai do MWh
        run: node scripts/ensaio-atingido-mwh.js

      # ... e o PRODUTO: cada linha publicada contra uma segunda conta feita da serie diaria, nenhum mes liquidado de fora,
      # o comissionamento e o gerado contra a serie mensal, o resumo refeito; cada plantio reprova pelo que plantou.
      - name: Ensaio · o historico da projecao (produto)
        run: node scripts/ensaio-historico-projecao.js --produto

      - name: Gerar irr_ufv.json (solarimetria por UFV)
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          OUT_CONTAINER: dados
          # A ponte do Power Automate ("SCADA SharePoint para Blob") ja grava os exports do SCADA
          # aqui. IIRR_CONTAINER faz o gerador LISTAR o container e usar o export MAIS RECENTE —
          # nao IIRR_URL, porque o nome e datado (IIRR_<AAAAMMDD>_<HHMMSS>.csv) e uma URL fixa
          # apodreceria no export seguinte. Com isso a semente do repo sai de cena.
          # 🔴 Se nao houver export no container, o passo FALHA de proposito: cair na semente
          # deixaria o painel congelado sem nada dizer por que.
          # A ponte do Power Automate ("SCADA SharePoint para Blob") grava os exports do SCADA aqui.
          # IIRR_CONTAINER faz o gerador LISTAR e usar o mais recente. Nao IIRR_URL: o nome e datado
          # E vem PREFIXADO pelo id do item (77884_IIRR_20260808_095901.csv) — nao ha endereco fixo.
          # 🔴 Falha de proposito se nao houver export: cair na semente congelaria o painel calado.
          IIRR_CONTAINER: scada-raw
        run: node scripts/gen-irradiancia.js

      # e o PRODUTO: nenhum trecho travado na serie de 30 min publicada; o M5 travado reinserido reprova. Depois de gerar
      # e antes do PR, que le esta irradiancia (e refaz os dias com leitura retirada).
      - name: Ensaio · a leitura travada sai da serie (produto)
        run: node scripts/ensaio-irr-travada.js --produto

      # PR do conjunto no 230 kV, com o corte dentro e corrigido pelo corte. DEPOIS da irradiancia (le o
      # irr_60min que o passo anterior grava) e com `always()`: se a irradiancia falhar, o PR recalcula com a
      # publicada — os dias sem irradiacao nova simplesmente nao fecham.
      - name: Gerar pr.json (Performance Ratio no 230 kV)
        if: always()
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
        run: node scripts/gen-pr.js

      - name: Ensaio · o PR confere com o executivo e com o medidor
        if: always()
        run: node scripts/ensaio-pr.js

      # ... e o PRODUTO pr_ufv.json: contratos e meses refeitos, o corte da usina igual ao do executivo, e a soma das nove
      # usinas contra o 230 kV nos dias com as mesmas horas validas (entre 1,000 e 1,010).
      - name: Ensaio · o PR por usina e por contrato (produto)
        if: always()
        run: node scripts/ensaio-pr-ufv.js --produto

      # O que a manchete de fato publicou para o mes aberto, por entidade e dias fechados, num arquivo que so cresce. No FIM
      # do job e com `if`: roda sempre que o executivo foi gravado, mesmo com um ensaio vermelho acima (a chave de um dia
      # que passou nao volta), e um estouro dele nao pula ensaio nem gerador nenhum. So o 404 conta como inexistente.
      - name: Gravar projecao_registro.json (o que a projecao disse, dia a dia)
        if: ${{ !cancelled() && steps.gen_exec.outcome == 'success' }}
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          OUT_CONTAINER: dados
        run: node scripts/gen-registro-projecao.js

      # ... e o registro publicado: chaves unicas, versoes coerentes, toda linha de mes aberto da manchete presente nele.
      - name: Ensaio · o registro da projecao
        if: ${{ !cancelled() && steps.gen_exec.outcome == 'success' }}
        run: node scripts/ensaio-historico-projecao.js --registro
