name: Executivo -> executivo.json (visao executiva)
on:
  schedule:
    - cron: '0 9-22 * * *' # de hora em hora, 06h-19h BRT
  workflow_dispatch: {}
concurrency:
  group: gen-executivo
  cancel-in-progress: true
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i @azure/storage-blob@12
      - name: Gerar executivo.json
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          OUT_CONTAINER: dados
          OUT_BLOB: executivo.json
        run: node scripts/gen-executivo.js
