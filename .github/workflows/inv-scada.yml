name: Inversores SCADA -> inv_scada_supervisorio.json (comparacao; o inv_scada.json das telas e do logger desde 19/10/2026)
on:
  # export-att-fim (22/10/2026, decisão do humano): o export _ATT do supervisório acabou em 15/10 e NÃO é mais fonte; este
  # workflow só lia esse export. Sai do relógio e fica só no disparo manual (o inv_scada.json das telas é do logger).
  workflow_dispatch:
    inputs:
      dias:
        description: 'Quanto do BRUTO reprocessar (padrao 60)'
        required: false
        default: '60'
      janela:
        description: 'Quanto o HISTORICO guarda, em dias (padrao 365)'
        required: false
        default: '365'
      janela_hora:
        description: 'Dias de detalhe de meia hora publicados (padrao 30)'
        required: false
        default: '30'
      listar:
        description: 'so inventariar o container (1 = sim, nao grava nada)'
        required: false
        default: ''
concurrency:   # acumulativo (historico de 365 dias, tres blobs em sequencia): o segundo disparo espera
  # por branch: um dispatch de outra branch (que falha na guarda do main) nao cancela nem desloca a fila do main
  group: gen-inv-scada-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-latest
    # 🔐 SEM A CHAVE DA CONTA (plano OIDC, etapa 4, 25/10/2026). Os passos que gravam levam o OIDC do proprio job: AZURE_CLIENT_ID e
    #    AZURE_TENANT_ID no env DO PASSO (identificadores, nao credenciais; as do relogio-deploy). Os passos que so leem o publicado
    #    levam a SAS de leitura; os sem rede ficam sem credencial nenhuma, de proposito.
    #    `permissions` explicito zera o resto: `contents: read` e o que o checkout precisa.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      # O dispatch deixa escolher a branch na tela do Actions. Fora do main o Entra recusa a troca com um AADSTS que parece
      # credencial quebrada: este passo FALHA antes, dizendo a causa (falha, nao pula: `if:` que pula esconderia o vermelho).
      # Vale para todo modo do workflow (ensaio e carga inclusive): fora do main nao ha credencial nenhuma.
      # A ref vem da variavel de ambiente, nunca interpolada no script: nome de branch com `$(...)` viraria comando.
      - name: So roda a partir do main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::este workflow so roda a partir do main: a credencial federada vale so para o main"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: '20' }
      - run: npm i @azure/storage-blob@12
      - name: Ensaio da acumulacao (CSV sintetico, sem rede)
        run: node scripts/ensaio-inv-scada-acumula.js
      # O detalhe de meia hora sai da diferenca do contador acumulado. Dois defeitos plantados em
      # horarios opostos provam que o horario separa o que o total do dia nao separa.
      - name: Ensaio do detalhe de meia hora (CSV sintetico, sem rede)
        run: node scripts/ensaio-inv-scada-hora.js
      # O contador diario guarda o valor de ONTEM ate o inversor acordar; o maior valor do dia publicava a energia de
      # ontem (26/09/2026, quase toda a frota). Nove series reais + o dia sujo contra o limpo, de ponta a ponta.
      - name: Ensaio · a energia do dia pela subida do contador de vida (sem rede)
        run: node scripts/ensaio-contador-dia.js inv-scada
      # O nome do export ja mudou duas vezes sem aviso (`_ATT` em 24/09, `_ATT-02` em 29/09) e nas duas o dia sumiu em
      # silencio. O ensaio le o CARIMBO do fonte do gerador e o julga contra os nomes que chegaram, antes de gerar.
      - name: Ensaio · o gerador le todo nome de export que chegou
        run: node scripts/ensaio-carimbo-inversor.js
      # 💰 Copia do scada-raw entre execucoes (`lib-cache-blob.js`, 10/10/2026): este job baixava ~2 GB do mesmo bruto
      #    a cada execucao (medido em 09/10/2026). Mesma regra do scada.yml; cache proprio deste workflow.
      - name: Restaurar a copia do scada-raw
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .cache-blob
          key: scada-raw-gen-inv-scada-${{ github.run_id }}
          restore-keys: scada-raw-gen-inv-scada-
      - name: Gerar inv_scada_supervisorio.json
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          RAW_CONTAINER: scada-raw
          OUT_CONTAINER: dados
          OUT_BLOB: inv_scada_supervisorio.json
          DIAS: ${{ github.event.inputs.dias || '60' }}
          JANELA: ${{ github.event.inputs.janela || '365' }}
          HIST_BLOB: inv_scada_hist.json
          JANELA_HORA: ${{ github.event.inputs.janela_hora || '30' }}
          HORA_BLOB: inv_scada_hora.json
          LISTAR: ${{ github.event.inputs.listar }}
          CACHE_BLOB_DIR: ${{ github.workspace }}/.cache-blob
        run: node scripts/gen-inv-scada.js
      - name: Guardar a copia do scada-raw
        if: ${{ !cancelled() && hashFiles('.cache-blob/**/*.meta') != '' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .cache-blob
          key: scada-raw-gen-inv-scada-${{ hashFiles('.cache-blob/**/*.meta') }}

      # O historico e rotulado pelo dia do CONTEUDO desde 24/09/2026 (antes, pelo nome do arquivo, um dia
      # adiante). O ensaio prova pela assinatura de cada dia entre os inversores, contra o perdas_inv, e roda
      # DEPOIS de gerar: ele julga o produto, inclusive a migracao do historico que a primeira rodada faz.
      - name: Ensaio · o historico esta no dia do conteudo
        env:
          DADOS_SAS: ${{ secrets.DADOS_LEITURA }}   # so le o publicado: a SAS de leitura (revogavel), nao o OIDC que grava
        run: node scripts/ensaio-inv-scada-dia.js
