name: Inversores -> inversores.json (confiabilidade)
on:
  schedule:
    - cron: '22 12 * * *' # 09:22 BRT · min 22 foge do :00
    - cron: '22 18 * * *' # 15:22 BRT
    - cron: '22 0 * * *'  # 21:22 BRT · pa-inversores (20/10/2026): a planilha salva a tarde entra no mesmo dia
  workflow_dispatch: {}
concurrency:
  group: gen-inversores
  cancel-in-progress: true
jobs:
  gen:
    runs-on: ubuntu-latest
    env:   # Fase 2 (PROMOVER fase2-virada): toda leitura de `dados` pela lib-le-dados com credencial, em todo passo do job
      DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: '20' }
      - run: npm i xlsx@0.18.5 @azure/storage-blob@12
      - name: Gerar inversores.json
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          RAW_CONTAINER: inversores-raw
          OUT_CONTAINER: dados
          OUT_BLOB: inversores.json
        run: node scripts/gen-inversores.js
