name: Inversores -> inversores.json (confiabilidade)
on:
  schedule:
    - cron: '0 12 * * *' # 09:00 BRT
    - cron: '0 18 * * *' # 15:00 BRT
  workflow_dispatch: {}
concurrency:
  group: gen-inversores
  cancel-in-progress: true
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i xlsx@0.18.5 @azure/storage-blob@12
      - name: Gerar inversores.json
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          RAW_CONTAINER: inversores-raw
          OUT_CONTAINER: dados
          OUT_BLOB: inversores.json
        run: node scripts/gen-inversores.js
