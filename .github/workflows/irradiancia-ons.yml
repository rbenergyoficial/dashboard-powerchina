name: Irradiância ONS → Blob (diário)

# O ONS publica este conjunto DUAS vezes por dia (12h e 19h), e o proprio dataset avisa que o dado
# passa por conferencia continua e pode ser corrigido depois da primeira publicacao. Por isso as
# cinco rodadas continuam: 15:30 e 22:30 UTC pegam as publicacoes, as outras pegam correcao.
#
# ⚠️ Eu tinha proposto CORTAR rodadas por causa do custo de rede. A migracao para parquet tirou
# 94% desse custo (67 MB -> 3,8 MB por mes), entao o motivo do corte deixou de existir — e cortar
# passaria a trocar frescor por nada.
on:
  schedule:
    - cron: '30 6,15,17,19,22 * * *'  # 03:30, 12:30, 14:30, 16:30 e 19:30 BRT
  workflow_dispatch:
    inputs:
      meses:
        description: 'meses a reprocessar, separados por virgula (ex.: 2026_07,2026_08). Vazio = corrente + anterior'
        required: false
        default: ''
      ensaio:
        description: 'sim = comparar o caminho do parquet com o do CSV linha a linha, SEM publicar'
        required: false
        default: 'nao'

concurrency:   # grava ons_irradiancia_<mes>: duas rodadas (relogio + agendador do GitHub) nao gravam juntas
  # por branch: um dispatch de outra branch (que falha na guarda do main) nao cancela nem desloca a fila do main
  group: gen-irradiancia-ons-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gerar-irradiancia:
    runs-on: ubuntu-latest
    # 🔐 SEM A CHAVE DA CONTA (plano OIDC, etapa 4, 25/10/2026): le pela lib-le-dados e grava pela lib-conteiner com o token do
    #    proprio job, trocado no Entra: valido ~1 h e renovado sozinho, emitido so para o `main` deste repositorio, com papel so
    #    de dado, conteiner a conteiner. As duas variaveis sao identificadores, nao credenciais (as do relogio-deploy), e vao
    #    no env DO PASSO que grava: o ensaio deste job nao toca o storage e fica sem credencial nenhuma.
    #    `permissions` explicito zera o resto: `contents: read` e o que o checkout precisa.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      # O dispatch deixa escolher a branch na tela do Actions. Fora do main o Entra recusa a troca com um AADSTS que parece
      # credencial quebrada: este passo FALHA antes, dizendo a causa (falha, nao pula: `if:` que pula esconderia o vermelho).
      # Vale para todo modo do workflow (ensaio e sonda inclusive): fora do main nao ha credencial nenhuma.
      # A ref vem da variavel de ambiente, nunca interpolada no script: nome de branch com `$(...)` viraria comando.
      - name: So roda a partir do main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::este workflow so roda a partir do main: a credencial federada vale so para o main"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
      - name: Instalar dependencias (SDK do Blob e leitor de parquet)
        run: npm install @azure/storage-blob@12 hyparquet@1.31.5

      # O ensaio baixa o CSV de ~67 MB de proposito, para comparar com a referencia. Por isso ele
      # e sob demanda e nao entra na rodada agendada.
      - name: Comparar parquet com CSV (sem publicar)
        if: ${{ inputs.ensaio == 'sim' }}
        run: node scripts/ensaio-irradiancia-parquet.js

      - name: Gerar e enviar irradiância
        if: ${{ inputs.ensaio != 'sim' }}
        env:
          MESES: ${{ inputs.meses || '' }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: node scripts/gen-irradiancia-ons.js
