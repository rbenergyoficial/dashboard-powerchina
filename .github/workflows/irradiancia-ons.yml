name: Irradiância ONS → Blob (diário)

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gerar-irradiancia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependência (SDK do Blob)
        run: npm install @azure/storage-blob@^12
      - name: Gerar e enviar irradiância (mês corrente + anterior)
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
        run: node scripts/gen-irradiancia-ons.js
