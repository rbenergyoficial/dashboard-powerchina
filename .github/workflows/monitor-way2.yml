name: Monitor Way2 (5 min)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: monitor-way2
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i @azure/storage-blob@12
      - name: Gerar way2_monitor.json
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          WAY2_TOKEN: ${{ secrets.WAY2_TOKEN }}
        run: node scripts/gen-monitor-way2.js
