name: MUST intradiário -> must_5min / 15min / 30min / 60min

# Roda 10 min depois do must.yml, que ja acordou a API da Way2 no mesmo horario.
#
# JOB SEPARADO do must.yml de proposito: sao dois produtos com falhas independentes. O diario
# alimenta o ranking e a situacao por parque; o intradiario alimenta a forma da curva. Juntos, uma
# falha na carga longa derrubaria tambem o blob que ja funciona ha meses — e o vermelho no job
# deixaria de dizer qual dos dois quebrou.
on:
  schedule:
    # A cada 15 min, para o dia CORRENTE preencher conforme as leituras chegam. Cada rodada busca
    # so o dia de hoje (DIAS=2 cobre hoje e ontem) e regrava os quatro blobs — ~10 s.
    #
    # 15 min e nao 5: o cron do GitHub Actions atrasa de 30 a 90 min quando pedido no :00, e uma
    # cadencia mais curta so acumularia execucoes atrasadas sem melhorar a latencia real.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dias:
        description: 'quantos dias para tras processar (365 = carga historica completa)'
        required: false
        default: '2'
      forcar:
        description: 'sim = reprocessa dia ja presente no blob'
        required: false
        default: 'nao'
      so:
        description: 'processar so uma resolucao: 5, 15, 30 ou 60 (vazio = as quatro)'
        required: false
        default: ''
# 🔴 O CRON NAO PODE CANCELAR UMA CARGA HISTORICA. Com `cancel-in-progress: true` puro, o job
# agendado que chega no meio de um dispatch longo MATA o dispatch — foi o que aconteceu em
# 22/08/2026: a recarga dos 366 dias, necessaria para corrigir o alinhamento do quarto de hora,
# foi cancelada aos 12 minutos pelo agendamento seguinte, e o historico ficou com o dado velho.
#
# Agora so o proprio agendamento e cancelavel: um dispatch em andamento faz o cron seguinte
# ESPERAR em vez de derrubar. Dois runs nao correm juntos, entao nao ha risco de duas gravacoes
# concorrentes no mesmo blob.
concurrency:
  group: gen-must-intra
  cancel-in-progress: ${{ github.event_name == 'schedule' }}
jobs:
  gen:
    runs-on: ubuntu-latest
    # 60 min por causa da CARGA HISTORICA: 365 chamadas de dia inteiro em 5 min, com pausa de 0,6 s
    # entre elas mais a latencia da API. A rodada diaria gasta segundos — o teto existe para a
    # primeira, que reconstroi as quatro series.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i @azure/storage-blob@12
      - name: Gerar as quatro resolucoes
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          WAY2_TOKEN: ${{ secrets.WAY2_TOKEN }}
          OUT_CONTAINER: dados
          DIAS: ${{ inputs.dias || '2' }}
          FORCAR: ${{ inputs.forcar == 'sim' && '1' || '' }}
          SO: ${{ inputs.so }}
        run: node scripts/gen-must-intra.js
