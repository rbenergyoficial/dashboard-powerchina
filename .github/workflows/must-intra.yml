name: MUST intradiário -> must_5min / 15min / 30min / 60min

# Roda 10 min depois do must.yml, que ja acordou a API da Way2 no mesmo horario.
#
# JOB SEPARADO do must.yml de proposito: sao dois produtos com falhas independentes. O diario
# alimenta o ranking e a situacao por parque; o intradiario alimenta a forma da curva. Juntos, uma
# falha na carga longa derrubaria tambem o blob que ja funciona ha meses — e o vermelho no job
# deixaria de dizer qual dos dois quebrou.
on:
  schedule:
    # A cada 15 min, para o dia CORRENTE preencher conforme as leituras chegam. Cada rodada busca
    # so o dia de hoje (DIAS=2 cobre hoje e ontem) e regrava os quatro blobs — ~10 s.
    #
    # 15 min e nao 5: o cron do GitHub Actions atrasa de 30 a 90 min quando pedido no :00, e uma
    # cadencia mais curta so acumularia execucoes atrasadas sem melhorar a latencia real.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dias:
        description: 'quantos dias para tras processar (365 = carga historica completa)'
        required: false
        default: '2'
      forcar:
        description: 'sim = reprocessa dia ja presente no blob'
        required: false
        default: 'nao'
      so:
        description: 'processar so uma resolucao: 5, 15, 30 ou 60 (vazio = as quatro)'
        required: false
        default: ''
# 🔴 O CRON NAO PODE CANCELAR UMA CARGA HISTORICA. Com `cancel-in-progress: true` puro, o job
# agendado que chega no meio de um dispatch longo MATA o dispatch — foi o que aconteceu em
# 22/08/2026: a recarga dos 366 dias, necessaria para corrigir o alinhamento do quarto de hora,
# foi cancelada aos 12 minutos pelo agendamento seguinte, e o historico ficou com o dado velho.
#
# Agora so o proprio agendamento e cancelavel: um dispatch em andamento faz o cron seguinte
# ESPERAR em vez de derrubar. Dois runs nao correm juntos, entao nao ha risco de duas gravacoes
# concorrentes no mesmo blob.
concurrency:
  group: gen-must-intra
  # ⚠️ A expressao e avaliada pelo run que CHEGA, e decide se ELE cancela os anteriores.
  # Com `== 'schedule'` o cron chegava com true e continuava matando o dispatch — que foi
  # exatamente o erro cometido na primeira tentativa de consertar isto. O correto e o
  # inverso: o cron chega com false e ESPERA; o dispatch chega com true e limpa a fila.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
# o alerta de ultrapassagem (alerta-must.js) abre ISSUE como memoria do dedup e manda e-mail pela
# identidade do proprio job, sem segredo (lib-alerta)
permissions:
  contents: read
  issues: write
  id-token: write
jobs:
  gen:
    runs-on: ubuntu-latest
    env:   # Fase 2 (PROMOVER fase2-virada): toda leitura de `dados` pela lib-le-dados com credencial; sem isto os passos de ensaio liam pelo endereço público
      DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
    # 🔴 90 min, e o numero saiu de MEDICAO. A carga historica de 23/08/2026 foi CANCELADA aos 60:
    # com o gerador pedindo tres grandezas por chamada em vez de uma, o custo por chamada subiu de
    # ~2 s para ~7,7 s (medido no log: 20 dias em 461 s com 3 chamadas por dia). As 665 chamadas da
    # janela completa passaram de ~45 min para ~85.
    #
    # ⚠️ O teto maior e folga, NAO a solucao: a recarga completa passou a ser feita em FATIAS, uma
    # resolucao por vez (`so`), porque cada fatia cabe com margem — 5min ~4 min · 15min ~12 ·
    # 30min ~23 · 60min ~47 — e porque um dispatch longo BLOQUEIA o agendamento de 15 min, que e
    # quem alimenta a pagina e o vigia.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i @azure/storage-blob@12
      - name: Gerar as quatro resolucoes
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          WAY2_TOKEN: ${{ secrets.WAY2_TOKEN }}
          OUT_CONTAINER: dados
          DIAS: ${{ inputs.dias || '2' }}
          FORCAR: ${{ inputs.forcar == 'sim' && '1' || '' }}
          SO: ${{ inputs.so }}
        run: node scripts/gen-must-intra.js
      # 🔴 O VIGIA RODA SEMPRE, mesmo se o gerador falhar — e justamente ai que ele importa mais.
      # Sem `if: always()` um must-intra quebrado silenciaria o unico aviso de que o dado parou,
      # que e a forma exata do defeito de 23/08: a queda so apareceu porque um humano olhou a tela.
      #
      # Na carga historica (dispatch com muitos dias) ele nao roda: ali o blob e reescrito inteiro
      # e a idade do dado nao significa saude de medidor. Ja o dispatch com a janela padrao E a
      # mesma coisa que a rodada agendada — e e o unico jeito de conferir o vigia sob demanda,
      # em vez de esperar o proximo cron para descobrir se ele funciona.
      # 🔴 SEM PA_ALERT_WEBHOOK: o aviso por e-mail foi APOSENTADO em 23/08/2026. Medido naquele
      # dia: os nove pontos de MUST caem no MESMO instante que os medidores de 230 kV (13:30) e
      # nao voltam com os coletores — porque o MUST e calculado do ponto de conexao. Um aviso que
      # so dispara quando o TR1/TR2 param avisa do que o selo de medidores ja diz, agora que ele
      # pinta por GRUPO. Dois remetentes para um evento fazem o leitor parar de ler os dois.
      #
      # O passo CONTINUA rodando: ele mantem o must_saude.json fresco, que e o diagnostico de
      # "chegou medicao mas o MUST nao foi publicado" — o unico caso que os medidores nao contam.
      # Sem webhook o script apenas loga o que faria.
      - name: Medir o frescor do MUST (sem alerta)
        if: always() && (github.event_name == 'schedule' || (inputs.dias || '2') == '2')
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          WAY2_TOKEN: ${{ secrets.WAY2_TOKEN }}
        run: node scripts/gen-must-watchdog.js
      # 🔴 ULTRAPASSAGEM DO MUST NO QUARTO DE HORA (PROMOVER pa-alerta, decisao D2 de 18/10/2026).
      # Substitui o e-mail do fluxo "Way2 MUST Intradia" do Power Automate, que sai com o Premium em
      # 09/11 e nunca avisou: o filtro dele comparava hora local com UTC (300 execucoes, zero e-mail).
      # Le o must_15min.json que o passo de cima acabou de gravar. O ensaio vem antes e e barato, e o
      # alerta SO RODA SE ELE PASSAR: regra quebrada nao manda e-mail falso nem cala em silencio (o
      # vermelho do ensaio ja e o aviso). O alerta roda mesmo com o gerador falho (o dado de ontem
      # ainda vale) e FALHA se o canal estiver incompleto (MAIL_PARA_MUST), se a entrega falhar ou se
      # a janela de hoje e ontem nao tiver nenhum intervalo julgado.
      - name: Ensaio do alerta de ultrapassagem do MUST
        id: ensaio_must
        if: always() && (github.event_name == 'schedule' || (inputs.dias || '2') == '2')
        run: node scripts/ensaio-alerta-must.js
      - name: Alerta de ultrapassagem do MUST (15 min)
        if: always() && steps.ensaio_must.outcome == 'success' && (github.event_name == 'schedule' || (inputs.dias || '2') == '2')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          AZ_MAIL_TENANT_ID: ${{ vars.AZ_MAIL_TENANT_ID }}
          AZ_MAIL_CLIENT_ID: ${{ vars.AZ_MAIL_CLIENT_ID }}
          MAIL_DE: ${{ vars.MAIL_DE }}
          MAIL_PARA: ${{ vars.MAIL_PARA_MUST }}
        run: node scripts/alerta-must.js
