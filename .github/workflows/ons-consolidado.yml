name: ONS consolidado (_all.json diario)
on:
  schedule:
        - cron: '17 18 * * *'   # ~15h Brasilia, depois do ONS publicar · min 17 foge do :00
  workflow_dispatch: {}
concurrency:
  # por branch: um dispatch de outra branch (que falha na guarda do main) nao cancela nem desloca a fila do main
  group: gen-ons-consolidado-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gen:
    runs-on: ubuntu-latest
    # 🔐 SEM A CHAVE DA CONTA (plano OIDC, etapa 4, 25/10/2026). Os passos que gravam levam o OIDC do proprio job: AZURE_CLIENT_ID e
    #    AZURE_TENANT_ID no env DO PASSO (identificadores, nao credenciais; as do relogio-deploy). Os ensaios que so leem o publicado
    #    levam a SAS de leitura; os sem rede ficam sem credencial nenhuma, de proposito. `permissions` explicito zera o resto:
    #    `contents: read` e o que o checkout precisa.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      # O dispatch deixa escolher a branch na tela do Actions. Fora do main o Entra recusa a troca com um AADSTS que parece
      # credencial quebrada: este passo FALHA antes, dizendo a causa (falha, nao pula: `if:` que pula esconderia o vermelho).
      # Vale para todo modo do workflow (ensaio e carga inclusive): fora do main nao ha credencial nenhuma.
      # A ref vem da variavel de ambiente, nunca interpolada no script: nome de branch com `$(...)` viraria comando.
      - name: So roda a partir do main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::este workflow so roda a partir do main: a credencial federada vale so para o main"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: '20' }
      - run: npm i @azure/storage-blob@12
      # O gravador do mes corrente (repara-ons-mes.js) e o unico escritor do ons_restricao_<mes>.json. O ensaio dele vem ANTES:
      # regra quebrada nao grava o mes. Mas so essa gravacao depende dele: com o ensaio vermelho o consolidado roda com
      # PULA_MES_CORRENTE=1 (o mes corrente fica como esta; o reparo dos meses fechados e a consolidacao seguem), e o _all, o gemeo e
      # a auditoria do PPC seguem. O job fica vermelho pelo ensaio.
      - name: Ensaio do mes corrente do ONS (formato do fluxo, ausencia x defeito, virada)
        id: ensaio_mes
        run: node scripts/ensaio-ons-mes-corrente.js
      - name: Consolidar ONS restricao + irradiancia
        id: consolidado
        if: ${{ !cancelled() }}
        env:
          PULA_MES_CORRENTE: ${{ steps.ensaio_mes.outcome != 'success' && '1' || '' }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          OUT_CONTAINER: dados
        run: node scripts/gen-ons-consolidado.js

      # DEPOIS do consolidado, e nao antes: le ons_restricao_all.json e ons_irradiancia_all.json,
      # que o passo acima acabou de gravar. Na ordem invertida ele calcularia sobre a rodada
      # anterior — a mesma armadilha do benchmark antes do executivo.
      # O proprio gerador tem portao: revalida contra os meses de referencia valida do ONS e
      # ABORTA sem gravar se o erro passar do limite. Job vermelho aqui significa modelo fora de
      # calibracao, e o blob antigo continua no ar — que e o comportamento certo.
      # 🔴 So meses FECHADOS entram no portao: com o mes em curso dentro, o veredito virava entre rodadas do
      #    mesmo dia so com a republicacao do operador. A REGRA, antes de gerar; o PRODUTO, logo depois.
      #    O gemeo depende do consolidado e da regra DELE, nao do ensaio do mes corrente: daqui para baixo todo passo tem `if` proprio.
      - name: Ensaio · o portao do gemeo julga so meses fechados (regra)
        id: gemeo_regra
        if: ${{ !cancelled() }}
        run: node scripts/ensaio-portao-gemeo.js --lib

      - name: Corte por gemeo de irradiancia (set/25 em diante)
        id: gen_gemeo
        if: ${{ !cancelled() && steps.consolidado.outcome == 'success' && steps.gemeo_regra.outcome == 'success' }}
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          OUT_CONTAINER: dados
          OUT_BLOB: corte_gemeo.json
        run: node scripts/gen-corte-gemeo.js

      # ... e o PRODUTO: o mes em curso (pelo `gerado_em`) marcado e fora da conta, e o MAE, o vies, o pior mes e a contagem
      # do `corte_gemeo.json` publicado refeitos dos meses fechados, no centesimo.
      - name: Ensaio · o portao do gemeo julga so meses fechados (produto)
        if: ${{ !cancelled() && steps.gen_gemeo.outcome == 'success' }}
        env:
          DADOS_SAS: ${{ secrets.DADOS_LEITURA }}   # so le o publicado: a SAS de leitura (revogavel), nao o OIDC que grava
        run: node scripts/ensaio-portao-gemeo.js --produto

      # DEPOIS do gemeo, sobre o que subiu: o `corte_mwh` (MWh com centesimos) fecha com o GWh e nao tem a
      # resolucao do GWh x 1000. O campo nasceu em 25/09/2026 sem ensaio nenhum.
      - name: Ensaio · o corte do gemeo em MWh fecha com o GWh e tem resolucao propria
        if: ${{ !cancelled() && steps.gen_gemeo.outcome == 'success' }}
        env:
          DADOS_SAS: ${{ secrets.DADOS_LEITURA }}   # so le o publicado: a SAS de leitura (revogavel), nao o OIDC que grava
        run: node scripts/ensaio-gemeo-mwh.js

      # A auditoria do registro da mesa entra DEPOIS do consolidado, pelo mesmo motivo do corte por
      # gemeo: ela le o `ons_restricao_all.json` que o primeiro passo acabou de gravar. Na ordem
      # invertida ela conferiria o registro de hoje contra o dado aberto de ontem e chamaria a
      # diferenca de divergencia.
      #
      # 🔴 O ensaio roda ANTES, e ele prova que a auditoria REPROVA: apaga um dia do registro,
      # planta uma linha ilegivel e desloca a potencia de um dia inteiro, exigindo o gatilho certo
      # em cada caso. Auditoria vista so no caminho feliz nao esta testada.
      #
      # ⚠️ Os dois passos do PPC dependem SO do consolidado, nao do gemeo: passo vermelho que nada tem
      # a ver com o registro nao desliga a auditoria dele.
      - name: Ensaio da auditoria do PPC
        id: ensaio_ppc
        if: ${{ !cancelled() && steps.consolidado.outcome == 'success' }}
        env:
          DADOS_SAS: ${{ secrets.DADOS_LEITURA }}   # so le o publicado: a SAS de leitura (revogavel), nao o OIDC que grava
        run: node scripts/ensaio-ppc.js
      # Vermelho aqui significa uma destas tres, e nenhuma delas se conserta no pipeline:
      #   · o operador nacional limitou e a mesa nao registrou (corte sem registro);
      #   · ha linha ilegivel no recorte (data ou hora que nao se le);
      #   · um dia inteiro saiu desalinhado (mediana acima do limiar, contra 0,000 MW medidos).
      # A divergencia de BORDA e o atraso de registro vao publicados SEM alarme: sao conhecidos,
      # medidos, e quem os resolve e a mesa, nao o codigo.
      - name: Auditar o registro do PPC contra o ONS
        if: ${{ !cancelled() && steps.consolidado.outcome == 'success' && steps.ensaio_ppc.outcome == 'success' }}
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          OUT_CONTAINER: dados
        run: node scripts/audita-ppc-ons.js
