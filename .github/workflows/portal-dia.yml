name: Portal · os arquivos de cada dia (Ao vivo em outros periodos)

# Grava, para cada dia fechado, os dois arquivos leves do Ao vivo (hist/portal_vivo_DIA.json e hist/portal_eletrico_DIA.json)
# e o indice hist/portal_dias.json (com o resumo hist/portal_resumo.json: a energia de cada dia por entidade, para a aba Energia
# comparar o dia com as semanas anteriores; e o resumo por circuito hist/portal_resumo_circuitos.json, para a aba 34,5 kV acima
# de 31 dias), montados pelas mesmas libs do Ao vivo e conferidos contra a fonte antes de gravar
# (scripts/gen-portal-dia.js). De madrugada, FECHA o dia anterior: refaz o dia pela API da Way2 e, se vier mais completo,
# substitui o snapshot do historico — o furo da virada (os ultimos ~15-20 min de todo dia, que o snapshot perdia).
# A CARGA (os dois anos do historico) e por disparo, por intervalo de datas.
on:
  schedule:
    # 03:10 a 05:40 UTC = 00:10 a 02:40 em Mauriti; varias tentativas porque o agendador do GitHub falha e a Way2 atrasa
    - cron: '10,40 3-5 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'fecha (ontem) | carga (intervalo)'
        type: choice
        options: [fecha, carga]
        default: fecha
      de:
        description: 'carga: primeiro dia (AAAA-MM-DD)'
        required: false
        default: ''
      ate:
        description: 'carga: ultimo dia (vazio = ontem)'
        required: false
        default: ''
      forcar:
        description: 'carga: regravar os dias que ja existem (1)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  # por branch: um dispatch de outra branch (que falha na guarda do main) nao cancela nem desloca a fila do main
  group: portal-dia-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dia:
    runs-on: ubuntu-latest
    # 🔐 SEM A CHAVE DA CONTA (plano OIDC, etapa 4, 25/10/2026). Os passos que gravam levam o OIDC do proprio job: AZURE_CLIENT_ID e
    #    AZURE_TENANT_ID no env DO PASSO (identificadores, nao credenciais; as do relogio-deploy). Os ensaios que so leem o publicado
    #    levam a SAS de leitura; os sem rede ficam sem credencial nenhuma, de proposito. `permissions` explicito zera o resto:
    #    `contents: read` e o que o checkout precisa.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 120
    steps:
      # O dispatch deixa escolher a branch na tela do Actions. Fora do main o Entra recusa a troca com um AADSTS que parece
      # credencial quebrada: este passo FALHA antes, dizendo a causa (falha, nao pula: `if:` que pula esconderia o vermelho).
      # Vale para todo modo do workflow (ensaio e carga inclusive): fora do main nao ha credencial nenhuma.
      # A ref vem da variavel de ambiente, nunca interpolada no script: nome de branch com `$(...)` viraria comando.
      - name: So roda a partir do main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::este workflow so roda a partir do main: a credencial federada vale so para o main"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
      - run: npm i @azure/storage-blob@12
      # A regra antes de gravar qualquer coisa: troca so com mais leituras, dia reprovado sem arquivo, precisa, carga e indice.
      - name: Ensaio · os arquivos de cada dia (regra)
        run: node scripts/ensaio-portal-dia.js
      - name: Ontem ja esta fechado?
        id: precisa
        if: ${{ github.event_name == 'schedule' || inputs.modo == 'fecha' }}
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          MODO: precisa
        run: node scripts/gen-portal-dia.js
      - name: Ontem refeito pela API (arquivo local, nao toca no ar)
        if: ${{ steps.precisa.outputs.precisa == 'true' }}
        env:
          WAY2_TOKEN: ${{ secrets.WAY2_TOKEN }}
        run: DIA=$(TZ=America/Fortaleza date -d yesterday +%F) LOCAL_OUT=ontem_api.json node scripts/gen-way2-eletrico.js
      # always(): com a API fora, o dia ganha o arquivo do historico que existe (sem o fim do dia, que a proxima tentativa completa)
      - name: Fechar ontem (o furo da virada) e gravar os arquivos do dia
        if: ${{ always() && steps.precisa.outputs.precisa == 'true' }}
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          MODO: fecha
          LOCAL_ELET: ontem_api.json
        run: node scripts/gen-portal-dia.js
      - name: Carga do historico
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'carga' }}
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          MODO: carga
          DE: ${{ inputs.de }}
          ATE: ${{ inputs.ate }}
          FORCAR: ${{ inputs.forcar }}
        run: node scripts/gen-portal-dia.js
