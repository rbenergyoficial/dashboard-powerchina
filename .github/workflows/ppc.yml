name: PPC (registro da mesa) -> ppc_restricao.json
on:
  schedule:
    # De hora em hora: a planilha e preenchida AO LONGO do turno, entao nao ha "a hora em que o
    # dado fica pronto" — ele cresce o dia inteiro. Minuto quebrado de proposito: no :00 o
    # agendador do GitHub atrasa de 30 a 90 min.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      ensaio:
        description: 'ensaio: le o dado de verdade e NAO publica (1 = sim)'
        required: false
        default: ''
concurrency:
  # por branch: um dispatch de outra branch (que falha na guarda do main) nao cancela nem desloca a fila do main
  group: gen-ppc-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-latest
    # 🔐 SEM A CHAVE DA CONTA (plano OIDC, etapa 4, 25/10/2026). Os passos que gravam levam o OIDC do proprio job: AZURE_CLIENT_ID e
    #    AZURE_TENANT_ID no env DO PASSO (identificadores, nao credenciais; as do relogio-deploy). Os ensaios que so leem o publicado
    #    levam a SAS de leitura; os sem rede ficam sem credencial nenhuma, de proposito. `permissions` explicito zera o resto:
    #    `contents: read` e o que o checkout precisa.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      # O dispatch deixa escolher a branch na tela do Actions. Fora do main o Entra recusa a troca com um AADSTS que parece
      # credencial quebrada: este passo FALHA antes, dizendo a causa (falha, nao pula: `if:` que pula esconderia o vermelho).
      # Vale para todo modo do workflow (ensaio e carga inclusive): fora do main nao ha credencial nenhuma.
      # A ref vem da variavel de ambiente, nunca interpolada no script: nome de branch com `$(...)` viraria comando.
      - name: So roda a partir do main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::este workflow so roda a partir do main: a credencial federada vale so para o main"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: '20' }
      - run: npm i @azure/storage-blob@12 xlsx@0.18
      # A REGRA da duracao sob restricao, em casos montados e sem rede, ANTES de gerar: reprova o
      # metodo ingenuo ("do primeiro ao ultimo lancamento restrito"), que erra em 97 dos 115 dias.
      - name: Ensaio da duracao sob restricao (regra)
        run: node scripts/ensaio-ppc-duracao.js --regra
      # A fusao das copias com o publicado: a copia mais nova manda nos dias que cobre, e linha que a
      # mesa corrigiu sai do ar. So dados plantados; reprova a fusao antiga, que nunca apagava.
      - name: Ensaio da fusao das copias da planilha
        run: node scripts/ensaio-ppc-funde.js
      # 🔴 O container `ppc-raw` e alimentado por um coletor que roda FORA daqui, na maquina onde a
      # pasta esta sincronizada. Se ele parar, este job continua rodando e republicando o que ja
      # tinha — sem erro nenhum. Quem denuncia isso e a idade do ultimo dia na auditoria, e nao
      # este workflow: um job verde nao prova que o dado e novo.
      # 💰 custo-ppc (24/10/2026): a copia em disco das planilhas da execucao anterior (`lib-cache-blob.js`); so a planilha nova vem
      #    pela rede. Antes, todas eram baixadas de hora em hora (~1,2 GB/dia de saida do storage, medido em 24/10).
      - name: Restaurar a copia das planilhas do PPC
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .cache-ppc
          key: ppc-raw-${{ github.run_id }}
          restore-keys: ppc-raw-
      - name: Gerar ppc_restricao.json
        id: gen
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          CACHE_BLOB_DIR: ${{ github.workspace }}/.cache-ppc
          RAW_CONTAINER: ppc-raw
          OUT_CONTAINER: dados
          LOCAL_OUT_DIR: ${{ github.event.inputs.ensaio && '/tmp/ppc' || '' }}
        run: |
          if [ -n "${LOCAL_OUT_DIR}" ]; then mkdir -p "${LOCAL_OUT_DIR}"; fi
          node scripts/gen-ppc.js
          if [ -n "${LOCAL_OUT_DIR}" ]; then echo '--- ensaio, nada publicado:'; ls -la "${LOCAL_OUT_DIR}"; fi
      # ... e o PRODUTO: o blob publicado contra uma recomputacao independente, DEPOIS de gerar. Antes do
      # gerador, um blob ausente ou vazio reprovava e pulava o unico passo que o recria.
      - name: Ensaio da duracao sob restricao (produto)
        if: ${{ !cancelled() && steps.gen.outcome == 'success' }}
        env:   # no modo ensaio, o arquivo que o gerador montou em vez do publicado
          LOCAL_OUT_DIR: ${{ github.event.inputs.ensaio && '/tmp/ppc' || '' }}
          DADOS_SAS: ${{ secrets.DADOS_LEITURA }}   # so le o publicado: a SAS de leitura (revogavel), nao o OIDC que grava
        run: node scripts/ensaio-ppc-duracao.js --produto
      # ⚠️ Falhar ao guardar a copia nao derruba o job: a proxima execucao so baixa mais. A chave e o hash das marcas: sem planilha
      #    nova, a execucao nao regrava o cache.
      - name: Guardar a copia das planilhas do PPC
        if: ${{ !cancelled() && hashFiles('.cache-ppc/**/*.meta') != '' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .cache-ppc
          key: ppc-raw-${{ hashFiles('.cache-ppc/**/*.meta') }}
