name: SCADA -> scada_comparativo.json (diario)
on:
  schedule:
    - cron: '30 11 * * *' # 08:30 BRT (UTC-3)
    - cron: '7 17 * * *'  # 14:07 BRT · min 7 foge do :00
    - cron: '7 21 * * *'  # 18:07 BRT
  workflow_dispatch:
    inputs:
      diag_cols:
        description: 'Listar colunas (diagnostico reativa)'
        default: '0'
      # scada-db (22/10/2026): sairam `vigia_modo` e `vigia_container`, que so serviam ao vigia da intake do scada-raw (o export
      # de 30 min, que acabou em 15/10 e nao e mais fonte). O vigia agora e o do banco, que nao tem modo de medir: o prazo e regra.
concurrency:
  group: gen-scada
  cancel-in-progress: true
# ⚠️ `issues: write` e o que o canal de alerta por issue exige. Sem ela ele falha com 403 —
#    e canal de alerta que falha calado e pior que canal nenhum.
# 🔴 `id-token: write`: o canal de E-MAIL usa OIDC — o GitHub troca um token de identidade proprio
#    por um token do Graph, sem segredo nenhum. Sem esta permissao o job nao consegue pedi-lo, e o
#    canal responde FALHOU em vez de sumir calado.
permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  gen:
    runs-on: ubuntu-latest
    env:   # Fase 2 (PROMOVER fase2-virada): toda leitura de `dados` pela lib-le-dados com credencial, em todo passo do job
      DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: '20' }
      - run: npm i xlsx@0.18.5 @azure/storage-blob@12
      # 💰 Copia do scada-raw entre execucoes (`lib-cache-blob.js`, 10/10/2026). O storage cobra a SAIDA para fora do
      #    continente, e este job baixava ~1,8 GB do MESMO bruto a cada execucao (medido em 09/10/2026). A copia so vale
      #    se conferir com a listagem (etag, tamanho, MD5); a chave de gravacao e o hash das marcas, entao execucao sem
      #    planilha nova nao regrava o cache. Sem copia (primeira vez, cache expirado) o gerador baixa tudo, como antes.
      - name: Restaurar a copia do scada-raw
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .cache-blob
          key: scada-raw-gen-scada-${{ github.run_id }}
          restore-keys: scada-raw-gen-scada-
      # scada-db (22/10/2026): a regra do banco (soma pelo unifilar, tudo-ou-nada, a extracao da reta, o banco vence a planilha so
      # no dia completo) e julgada ANTES de gravar; reprovou, o gerador nao roda e o blob do ar fica como estava.
      - name: Ensaio · o SCADA pelo banco do supervisorio (ensaio-scada-db)
        run: node scripts/ensaio-scada-db.js
      - name: Gerar scada_comparativo.json
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          RAW_CONTAINER: scada-raw
          OUT_CONTAINER: dados
          OUT_BLOB: scada_comparativo.json
          DIAG_COLS: ${{ github.event.inputs.diag_cols }}
          CACHE_BLOB_DIR: ${{ github.workspace }}/.cache-blob
        run: node scripts/gen-scada.js
      # ⚠️ Falhar ao guardar a copia nao derruba o job: a proxima execucao so baixa mais.
      - name: Guardar a copia do scada-raw
        if: ${{ !cancelled() && hashFiles('.cache-blob/**/*.meta') != '' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .cache-blob
          key: scada-raw-gen-scada-${{ hashFiles('.cache-blob/**/*.meta') }}

      # 🔴 `always()`: a hora em que o vigia mais importa e quando o passo acima falhou.
      #    E ele NAO derruba o job — o alerta e a saida dele, nao o codigo de retorno.
      # scada-db (22/10/2026): o vigia e o do BANCO (o ultimo dia com zip da extracao da reta no cofre, D ate D+2 12:00 BRT), no
      # lugar do vigia da intake do scada-raw, que alertava a cada rodada desde que o export de 30 min acabou (15/10).
      - name: Vigia do banco do supervisorio
        if: always()
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZ_MAIL_TENANT_ID: ${{ vars.AZ_MAIL_TENANT_ID }}
          AZ_MAIL_CLIENT_ID: ${{ vars.AZ_MAIL_CLIENT_ID }}
          MAIL_DE: ${{ vars.MAIL_DE }}
          MAIL_PARA: ${{ vars.MAIL_PARA }}
        run: node scripts/gen-scada-db-vigia.js

      # 🔴 O `inversores-raw` e a intake da pagina de Inversores, e ate 02/09/2026 ninguem o
      #    vigiava — a mesma cegueira que deixou a solarimetria tres dias atras sem nada ficar
      #    vermelho. Limiar proprio (170/336 h), MEDIDO no proprio container: la o deposito e
      #    humano, ~2 por semana, e as 50 h do SCADA acenderiam quase sempre.
      #
      # ⚠️ So na rodada das 11:30 UTC. O container recebe ~2 arquivos por semana; tres verificacoes
      #    por dia sobre um limiar de 7 dias nao acrescentam nada. Duas origens contam como essa rodada:
      #    o cron das 11:30 entregue pelo agendador do GitHub (traz `github.event.schedule`, com qualquer
      #    atraso), e o dispatch, que e como o relogio dispara (pontual, sem o cron), feito antes das 15 UTC.
      #    So o primeiro valia, e o passo era pulado nos dias em que so o relogio rodava. Os crons de 17 e
      #    21 UTC atrasados chegam com o schedule deles e ficam fora. Nos dias em que o GitHub tambem
      #    entrega o das 11:30, o vigia roda duas vezes: com a intake em alerta, sao dois avisos no dia.
      #    Para medir fora da rodada: `RAW_CONTAINER=inversores-raw MODO=medir node scripts/gen-scada-intake-watchdog.js`.
      - name: A rodada e a das 11:30 UTC?
        id: rodada
        if: always()
        run: echo "manha=$([ "$(date -u +%H)" -lt 15 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - name: Vigia da intake dos Inversores
        if: always() && (github.event.schedule == '30 11 * * *' || (github.event_name == 'workflow_dispatch' && steps.rodada.outputs.manha == '1'))
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          RAW_CONTAINER: inversores-raw
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZ_MAIL_TENANT_ID: ${{ vars.AZ_MAIL_TENANT_ID }}
          AZ_MAIL_CLIENT_ID: ${{ vars.AZ_MAIL_CLIENT_ID }}
          MAIL_DE: ${{ vars.MAIL_DE }}
          MAIL_PARA: ${{ vars.MAIL_PARA }}
        run: node scripts/gen-scada-intake-watchdog.js
