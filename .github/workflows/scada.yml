name: SCADA -> scada_comparativo.json (diario)
on:
  schedule:
    - cron: '30 11 * * *' # 08:30 BRT (UTC-3)
    - cron: '0 17 * * *'  # 14:00 BRT
    - cron: '0 21 * * *'  # 18:00 BRT
  workflow_dispatch:
    inputs:
      diag_cols:
        description: 'Listar colunas (diagnostico reativa)'
        default: '0'
      vigia_modo:
        description: 'vigia da intake: vigiar (padrao) ou medir (so imprime a distribuicao)'
        default: 'vigiar'
      # 🔴 So serve para MEDIR outro container. O vigia RECUSA `vigiar` onde o limiar nao foi
      #    medido, entao apontar isto para `inversores-raw` no modo padrao falha alto — que e o
      #    comportamento certo, e nao um acidente.
      vigia_container:
        description: 'container a inspecionar: scada-raw (padrao) ou inversores-raw (so com medir)'
        default: 'scada-raw'
concurrency:
  group: gen-scada
  cancel-in-progress: true
# ⚠️ `issues: write` e o que o canal de alerta por issue exige. Sem ela ele falha com 403 —
#    e canal de alerta que falha calado e pior que canal nenhum.
# 🔴 `id-token: write`: o canal de E-MAIL usa OIDC — o GitHub troca um token de identidade proprio
#    por um token do Graph, sem segredo nenhum. Sem esta permissao o job nao consegue pedi-lo, e o
#    canal responde FALHOU em vez de sumir calado.
permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i xlsx@0.18.5 @azure/storage-blob@12
      - name: Gerar scada_comparativo.json
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          RAW_CONTAINER: scada-raw
          OUT_CONTAINER: dados
          OUT_BLOB: scada_comparativo.json
          DIAG_COLS: ${{ github.event.inputs.diag_cols }}
        run: node scripts/gen-scada.js

      # 🔴 `always()`: a hora em que o vigia mais importa e quando o passo acima falhou.
      #    E ele NAO derruba o job — o alerta e a saida dele, nao o codigo de retorno.
      - name: Vigia da intake do SCADA
        if: always()
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          RAW_CONTAINER: ${{ github.event.inputs.vigia_container || 'scada-raw' }}
          MODO: ${{ github.event.inputs.vigia_modo || 'vigiar' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PA_ALERT_WEBHOOK: ${{ secrets.PA_ALERT_WEBHOOK }}
          AZ_MAIL_TENANT_ID: ${{ vars.AZ_MAIL_TENANT_ID }}
          AZ_MAIL_CLIENT_ID: ${{ vars.AZ_MAIL_CLIENT_ID }}
          MAIL_DE: ${{ vars.MAIL_DE }}
          MAIL_PARA: ${{ vars.MAIL_PARA }}
        run: node scripts/gen-scada-intake-watchdog.js

      # 🔴 O `inversores-raw` e a intake da pagina de Inversores, e ate 02/09/2026 ninguem o
      #    vigiava — a mesma cegueira que deixou a solarimetria tres dias atras sem nada ficar
      #    vermelho. Limiar proprio (170/336 h), MEDIDO no proprio container: la o deposito e
      #    humano, ~2 por semana, e as 50 h do SCADA acenderiam quase sempre.
      #
      # ⚠️ So no agendamento das 11:30, e a condicao diz isso literalmente. O container recebe ~2
      #    arquivos por semana; tres verificacoes por dia sobre um limiar de 7 dias nao
      #    acrescentam nada. Por despacho, use a entrada `vigia_container`.
      - name: Vigia da intake dos Inversores
        if: always() && github.event.schedule == '30 11 * * *'
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          RAW_CONTAINER: inversores-raw
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PA_ALERT_WEBHOOK: ${{ secrets.PA_ALERT_WEBHOOK }}
          AZ_MAIL_TENANT_ID: ${{ vars.AZ_MAIL_TENANT_ID }}
          AZ_MAIL_CLIENT_ID: ${{ vars.AZ_MAIL_CLIENT_ID }}
          MAIL_DE: ${{ vars.MAIL_DE }}
          MAIL_PARA: ${{ vars.MAIL_PARA }}
        run: node scripts/gen-scada-intake-watchdog.js
