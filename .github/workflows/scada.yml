name: SCADA -> scada_comparativo.json (diario)
on:
  schedule:
    - cron: '30 11 * * *' # 08:30 BRT (UTC-3)
    - cron: '0 17 * * *'  # 14:00 BRT
    - cron: '0 21 * * *'  # 18:00 BRT
  workflow_dispatch:
    inputs:
      diag_cols:
        description: 'Listar colunas (diagnostico reativa)'
        default: '0'
concurrency:
  group: gen-scada
  cancel-in-progress: true
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i xlsx@0.18.5 @azure/storage-blob@12
      - name: Gerar scada_comparativo.json
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          RAW_CONTAINER: scada-raw
          OUT_CONTAINER: dados
          OUT_BLOB: scada_comparativo.json
          DIAG_COLS: ${{ github.event.inputs.diag_cols }}
        run: node scripts/gen-scada.js
