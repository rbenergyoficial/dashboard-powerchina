name: Logger Sungrow -> sg_*.json (inversor, PID e eletrocentro a cada 5 min) e sp_ts_*.json (setpoint por eletrocentro)
on:
  schedule:
    - cron: '17 13 * * *' # 10:17 BRT — depois do export do SCADA (~03:00 BRT) e do inv-scada.yml; o lote do logger chega de dia
  workflow_dispatch:
    inputs:
      refazer:
        description: 'reler todos os zips do sungrow-raw (1 = sim; a primeira carga leva perto de 1 h)'
        required: false
        default: ''
concurrency:
  group: gen-sungrow
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-latest
    env:   # Fase 2 (PROMOVER fase2-virada): toda leitura de `dados` pela lib-le-dados com credencial; sem isto os passos de ensaio liam pelo endereço público
      DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i @azure/storage-blob@12
      # zip, CSV por nome de coluna, identificacao pelo contador de vida e pelo logger, dia parcial, conferencia so com dia
      # inteiro, busca funda e sua memoria, migracao de esquema, saude do inversor e o dicionario de codigos contra o
      # manual, o eletrocentro de 5 min e as horas fora da rede, com plantios. Sem rede: julga a regra antes de gerar. A
      # primeira rodada depois de um esquema novo do historico rele todos os zips (perto de 40 min; timeout 240).
      - name: Ensaio do logger Sungrow (sem rede)
        id: r_sungrow
        if: ${{ !cancelled() }}
        run: node scripts/ensaio-sungrow.js
      # a energia do dia sai da lib-contador-dia, a mesma do gen-inv-scada e do gen-perdas
      - name: Ensaio · a energia do dia pela subida do contador de vida (sem rede)
        id: r_contador
        if: ${{ !cancelled() }}
        run: node scripts/ensaio-contador-dia.js perdas
      # a soma por eletrocentro da potencia e do setpoint de despacho (SCADA, 30 min): carimbo sem leitura nulo, acumulo, contrato da fonte e leitura do blob, com plantios
      - name: Ensaio · potencia e setpoint por eletrocentro (sem rede)
        id: r_ts_setpoint
        if: ${{ !cancelled() }}
        run: node scripts/ensaio-ts-setpoint.js
      # a disponibilidade dos inversores (lib-sungrow-disp, sg_disp_dia.json): estado pela Tabela 2 pelo NOME da coluna,
      # heranca do ultimo estado valido atravessando a meia-noite, falta de leitura fora da conta, irradiancia da estacao,
      # so o inversor que ocupa a posicao no dia, Complexo pela capacidade instalada; o gerador de ponta a ponta (logger
      # forjado fora do historico, recarga sem historico, estacao ausente aborta), com plantios. Sem rede. A primeira rodada
      # sem sg_disp_hist.json rele todos os zips uma vez (cabe no timeout de 240 min)
      - name: Ensaio · disponibilidade dos inversores pelo logger (sem rede)
        id: r_disp
        if: ${{ !cancelled() }}
        run: node scripts/ensaio-sungrow-disp.js
      # as strings e a curva de 5 min do logger (lib-sungrow-str, sg-logger-str): escala, pico, razao sem a limitacao e sem o piso,
      # entrada vazia, sentinela, grade de 5 min; os produtos com a troca, a sem corrente e a fraca, o corte de 7 dias, com plantios
      - name: Ensaio · strings e curva de 5 min do logger (sem rede)
        id: r_str
        if: ${{ !cancelled() }}
        run: node scripts/ensaio-sungrow-str.js
      # strings-logger (19/10/2026): a curva de 30 min por inversor e a razao de cada string (pvstr_hora_<usina>, pvstr_str_<usina>_<ts>)
      # pelo logger, a MEDIA das seis leituras de 5 min (lib-pvstr-logger). Mundo forjado com a conta refeita no ensaio, o gerador de
      # ponta a ponta (semente da copia do supervisorio, abortos sem gravar), o nome da copia no gen-perdas, com plantios. Sem rede
      - name: Ensaio · strings de 30 min pelo logger (lib, sem rede)
        id: r_pvstr
        if: ${{ !cancelled() }}
        run: node scripts/ensaio-pvstr-logger.js --lib
      # fonte-inv-logger (19/10/2026): perdas_diario, perdas_inv, strings_alarme e inv_scada pelo logger (lib-inv-logger), e a posicao
      # vaga no mesmo logger (o export do SCADA parou em 14/10). Mundo forjado com a conta a mao, o gen-sungrow de ponta a ponta sem
      # SCADA e plantios (SCADA de volta como fonte, sem leitura contada como parado, parado do supervisorio contado). Sem rede
      - name: Ensaio · dado de inversor das telas pelo logger (lib, sem rede)
        id: r_inv_logger
        if: ${{ !cancelled() }}
        run: node scripts/ensaio-inv-logger.js --lib
      # pa-sungrow (20/10/2026): os zips do logger pelo cofre (backup-dados-scada, gravado pela maquina-ponte) com o nome do sungrow-raw
      # (lib-sungrow-cofre): versao ~ mais nova, recusados, comparacao lote a lote, e o gerador de ponta a ponta com o Azure forjado (as
      # duas fontes dao produtos identicos), com plantios. Sem rede
      - name: Ensaio · zips do logger pelo cofre (sem rede)
        id: r_cofre
        if: ${{ !cancelled() }}
        run: node scripts/ensaio-sungrow-cofre.js
      # Cada gerador depende so dos ensaios de regra das libs DELE (lote5-workflows): o do setpoint e o das strings de 30 min nao barram
      # o sg_*; a cascata (produto do sg_saude) barra so o gen-inv-logger, que le o sg_saude.
      - name: Gerar sg_*.json
        id: gen_sg
        if: ${{ !cancelled() && steps.r_sungrow.outcome == 'success' && steps.r_contador.outcome == 'success' && steps.r_disp.outcome == 'success' && steps.r_str.outcome == 'success' && steps.r_cofre.outcome == 'success' && steps.r_inv_logger.outcome == 'success' }}
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          RAW: sungrow-raw
          SCADA_RAW: scada-raw
          OUT: dados
          REFAZER: ${{ github.event.inputs.refazer }}
          # a primeira rodada do esquema 7 (sg-logger-str) rele todos os zips e guarda o pico das strings de cada inversor-dia: folga de memoria
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/gen-sungrow.js
      # a cascata da usina no dia (PROMOVER sg-perdas): n_cc, ecc e eca do sg_saude.json sao exatamente a soma refeita dos inversores
      # com o dia inteiro (sg_saude_<usina>.json); tres plantios em memoria reprovam. E o que a pagina Confiabilidade e perdas le
      - name: Ensaio · a cascata da usina no dia (produto)
        id: cascata
        if: ${{ !cancelled() && steps.gen_sg.outcome == 'success' }}
        run: node scripts/ensaio-sungrow-cascata.js
      # fonte-inv-logger (19/10/2026): os blobs de inversor que o portal, o Grafana e o assistente leem (perdas_diario, perdas_inv,
      # strings_alarme, inv_scada), refeitos do que o gen-sungrow acabou de gravar. Na primeira rodada semeia a copia do supervisorio
      # (perdas_diario_scada, perdas_inv_scada) que o gen-perdas passa a gravar e o Comparativo le
      - name: Gerar perdas_diario, perdas_inv, strings_alarme e inv_scada pelo logger
        id: inv_logger
        if: ${{ !cancelled() && steps.gen_sg.outcome == 'success' && steps.cascata.outcome == 'success' && steps.r_inv_logger.outcome == 'success' && steps.r_disp.outcome == 'success' && steps.r_contador.outcome == 'success' && steps.r_sungrow.outcome == 'success' }}
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
        run: node scripts/gen-inv-logger.js
      # o produto: parados, parciais, lidos e sem leitura recontados do sg_disp_inv_dia, o supervisorio so nos dias da copia, nenhum
      # campo do supervisorio no perdas_inv; plantios em memoria. Custo declarado: roda DEPOIS de gravar, entao se reprovar o dado ja esta
      # no ar (job vermelho e melhor que dado ruim calado). Na PRIMEIRA rodada este job semeia as copias _scada: dispare-o antes do
      # perdas.yml e do inv-scada.yml no dia da promocao
      - name: Ensaio · dado de inversor das telas pelo logger (produto)
        if: ${{ !cancelled() && steps.inv_logger.outcome == 'success' }}
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
        run: node scripts/ensaio-inv-logger.js --produto
      # strings-logger (19/10/2026): pvstr_hora_<usina> e pvstr_str_<usina>_<ts> das telas pelo logger, refeitos do sg_curva/sg_str que o
      # gen-sungrow acabou de gravar. Na PRIMEIRA rodada semeia a copia do supervisorio (pvstr_hora_<usina>_scada, pvstr_str_<u>_<ts>_scada)
      # que o gen-perdas passa a gravar e o gen-ts-setpoint le logo abaixo; nome antigo ja do logger sem a copia aborta sem gravar
      - name: Gerar pvstr_hora e pvstr_str pelo logger
        id: pvstr_logger
        if: ${{ !cancelled() && steps.gen_sg.outcome == 'success' && steps.r_pvstr.outcome == 'success' && steps.r_str.outcome == 'success' && steps.r_inv_logger.outcome == 'success' && steps.r_disp.outcome == 'success' && steps.r_contador.outcome == 'success' && steps.r_sungrow.outcome == 'success' }}
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
        run: node scripts/gen-pvstr-logger.js
      # o produto: marca, contrato, a conta refeita no ensaio contra o registro de 5 min e a segunda rota (a energia do sg_saude), com
      # plantios em memoria. Custo declarado: roda DEPOIS de gravar (job vermelho e melhor que dado ruim calado). A segunda rota usa o
      # sg_saude: com a cascata vermelha acima ela julga contra um produto ja reprovado, e o vermelho dela pode ser o mesmo defeito
      - name: Ensaio · strings de 30 min pelo logger (produto)
        if: ${{ !cancelled() && steps.pvstr_logger.outcome == 'success' }}
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
        run: node scripts/ensaio-pvstr-logger.js --produto
      # o setpoint de despacho e por inversor e so existe no export do SCADA; a fonte (pvstr_hora_<usina>_scada, a copia do supervisorio
      # que o gen-perdas grava desde strings-logger) guarda 7 dias, entao um dia sem rodar nao perde nada
      - name: Gerar sp_ts_<usina>_<ts>.json
        if: ${{ !cancelled() && steps.r_ts_setpoint.outcome == 'success' && steps.r_pvstr.outcome == 'success' && steps.r_str.outcome == 'success' && steps.r_inv_logger.outcome == 'success' && steps.r_disp.outcome == 'success' && steps.r_contador.outcome == 'success' && steps.r_sungrow.outcome == 'success' }}
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          OUT: dados
        run: node scripts/gen-ts-setpoint.js
      # PROMOVER assistente-portal: o resumo diario do Assistente Inteligente (agente_dia.json) refeito com o dado novo deste workflow;
      # roda mesmo se um ensaio anterior reprovou (le os blobs publicados), e o ensaio dele refaz cada numero por codigo proprio
      - name: Ensaio · resumo do dia do assistente (lib, mundo forjado)
        id: agente_lib
        if: ${{ !cancelled() }}
        run: node scripts/ensaio-agente-dia.js --lib
      - name: Agente · resumo do dia do assistente
        id: agente_dia
        if: ${{ !cancelled() && steps.agente_lib.outcome == 'success' }}
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          FONTES_DIR: ${{ runner.temp }}/agente_dia_fontes
        run: node scripts/gen-agente-dia.js
      - name: Ensaio · resumo do dia do assistente (produto)
        if: ${{ !cancelled() && steps.agente_dia.outcome == 'success' }}
        env:
          FONTES_DIR: ${{ runner.temp }}/agente_dia_fontes   # as fontes que o gerador deste job leu e o produto que ele gravou
        run: node scripts/ensaio-agente-dia.js
      # 🔴 pa-sungrow EM SOMBRA (20/10/2026): o substituto do fluxo "Sungrow OneDrive RB para Blob" do Power Automate. SOMBRA=1 nao gera
      # nada: compara o cofre (backup-dados-scada/Sungrow_Logger/Sungrow_dados/<ano>/..., com o nome mapeado) com o sungrow-raw, lote a
      # lote, e confere byte a byte os 12 pares mais novos. Fica VERMELHO se um lote do sungrow-raw faltar no cofre, se um nome ou um
      # tamanho divergir, ou se o cofre trouxer um zip fora da forma. Ultimo passo e sem pular nada acima. O PROMOVER tira este passo,
      # poe FONTE: uniao no "Gerar sg_*.json" e desliga o fluxo no mesmo ato (um escritor so por blob)
      - name: Sombra · o cofre contra o sungrow-raw (nao grava)
        if: ${{ !cancelled() }}
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          RAW: sungrow-raw
          SOMBRA: '1'
          CONFERE_BYTES: '12'
        run: node scripts/gen-sungrow.js
