name: Transformadores da SE -> lado de 230 kV pelo medidor (intradia, 15 min)
# 🔴 trafo-medidor-intradia (23/10/2026). O medidor de faturamento chega a cada 5 min (o historico do dia corrente e regravado pelo
#    way2-recent), mas os `trafo_*.json` so eram refeitos no trafo.yml, uma vez por dia: a pagina Transformadores mostrava o 230 kV
#    parado no horario da ultima execucao diaria. Aqui roda SO o lado do medidor (gen-trafo-way2), de 15 em 15 min; a copia do
#    supervisorio (`trafo_scada_*.json`) continua do trafo.yml, que segue igual (o supervisorio chega uma vez por dia).
# ⚠️ Grupo de concorrencia PROPRIO: no mesmo grupo do trafo.yml uma execucao intradia pendente cancelaria a diaria pendente. As duas
#    gravam o mesmo `trafo_*.json` a partir das mesmas fontes; quem grava por ultimo vence, e a proxima execucao intradia acerta.
# 💰 Por execucao: o dia corrente do historico (~4 MB; os dias fechados voltam 304 pela copia em disco) e as saidas anteriores e as
#    copias do supervisorio (~9 MB).
on:
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch: {}
concurrency:
  group: gen-trafo-medidor
  cancel-in-progress: false
jobs:
  medidor:
    runs-on: ubuntu-latest
    env:   # Fase 2: toda leitura de `dados` pela lib-le-dados com credencial
      DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i @azure/storage-blob@12
      # O mesmo ensaio sem rede do trafo.yml (mundo forjado, o gerador de verdade, plantios): vermelho aqui = nada abaixo publica.
      - name: Ensaio · lado de 230 kV pelo medidor (sem rede)
        run: node scripts/ensaio-trafo-way2.js --lib
      # A mesma copia do historico do medidor do trafo.yml (mesmo prefixo de chave): os dias fechados voltam 304.
      - name: Restaurar a copia do historico do medidor
        uses: actions/cache/restore@v4
        with:
          path: .cache-blob
          key: hist-publico-trafo-way2-${{ github.run_id }}
          restore-keys: hist-publico-trafo-way2-
      - name: Gerar trafo_*.json (lado de 230 kV pelo medidor, 5 min integralizado)
        id: medidor
        env:
          CACHE_BLOB_DIR: ${{ github.workspace }}/.cache-blob
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/gen-trafo-way2.js
      - name: Ensaio · o publicado contra o medidor recontado
        if: ${{ !cancelled() && steps.medidor.outcome == 'success' }}
        env:
          CACHE_BLOB_DIR: ${{ github.workspace }}/.cache-blob
        run: node scripts/ensaio-trafo-way2.js --produto
      - name: Guardar a copia do historico do medidor
        if: ${{ !cancelled() && hashFiles('.cache-blob/publico/*.meta') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache-blob
          key: hist-publico-trafo-way2-${{ hashFiles('.cache-blob/publico/*.meta') }}
