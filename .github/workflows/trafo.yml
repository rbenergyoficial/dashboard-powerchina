name: Transformadores da SE -> trafo_scada_*.json (copia do supervisorio, 5, 30 e 60 min e diario)
on:
  schedule:
    # 07:38 BRT — o zip de ontem do banco do supervisorio chega ao cofre pela ponte (liga 05:55; trafo-db, 22/10/2026: o export de
    # 30 min, que chegava ~03:30, acabou em 15/10).
    # Minuto quebrado de proposito: no :00 o agendador do GitHub atrasa 30 a 90 min.
    - cron: '38 10 * * *'
  workflow_dispatch:
    inputs:
      ensaio:
        description: 'ensaio: le o dado de verdade e NAO publica (1 = sim)'
        required: false
        default: ''
concurrency:
  group: gen-trafo
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-latest
    env:   # Fase 2 (PROMOVER fase2-virada): toda leitura de `dados` pela lib-le-dados com credencial, em todo passo do job
      DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: '20' }
      - run: npm i @azure/storage-blob@12 xlsx@0.18.5
      # a serie de 5 min do historiador (planilhas IED/04T1 e IED/04T2): congelado fora, planilha viva vence o export,
      # tap interpolado fora, 30 min na grade, pico do dia dos 5 min, guarda de concordancia; com plantios. Sem rede.
      - name: Ensaio · trafo com a planilha de 5 min do historiador (sem rede)
        run: node scripts/ensaio-trafo.js
      # 🔴 lote fonte-trafo-way2 (19/10/2026): o gen-trafo grava a COPIA DO SUPERVISORIO (`trafo_scada_*.json`), com nome proprio. As
      #    telas leem `trafo_*.json`, do gen-trafo-way2 (trafo-medidor.yml): lado de 230 kV pelo medidor de faturamento, e desta copia so o que o
      #    medidor nao mede (temperaturas, comutador, 34,5 kV).
      # A copia em disco do bruto do supervisorio entre execucoes (lib-cache-blob), em DUAS entradas de cache, cada uma com a sua chave:
      #    o banco (zips diarios no cofre, ~340 KB por dia, ate um ano: ganha um dia novo por execucao) e as planilhas do historiador e os CSV
      #    do scada-raw (~360 MB que nao mudam: a entrada so e regravada quando chega arquivo novo). So o arquivo novo vem pela rede.
      - name: Restaurar a copia do banco do supervisorio
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .cache-banco/backup-dados-scada
          key: scada-db-gen-trafo-${{ github.run_id }}
          restore-keys: scada-db-gen-trafo-
      - name: Restaurar a copia das planilhas do historiador
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .cache-banco/scada-raw
          key: scada-raw-gen-trafo-${{ github.run_id }}
          restore-keys: scada-raw-gen-trafo-
      - name: Gerar trafo_scada_*.json (copia do supervisorio)
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          RAW_CONTAINER: scada-raw
          OUT_CONTAINER: dados
          DB_CONTAINER: backup-dados-scada
          # a copia do bruto entre execucoes: .cache-banco/backup-dados-scada (o banco) e .cache-banco/scada-raw (planilhas e CSV)
          CACHE_BLOB_DIR: ${{ github.workspace }}/.cache-banco
          # No ensaio a saida vai para um diretorio do runner e o blob de producao nao e tocado.
          LOCAL_OUT_DIR: ${{ github.event.inputs.ensaio && '/tmp/trafo' || '' }}
          # as planilhas do historiador tem ate 41 MB; o SheetJS chega a ~0,8 GB por planilha
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          if [ -n "${LOCAL_OUT_DIR}" ]; then mkdir -p "${LOCAL_OUT_DIR}"; fi
          node scripts/gen-trafo.js
          if [ -n "${LOCAL_OUT_DIR}" ]; then echo '--- ensaio, nada publicado:'; ls -la "${LOCAL_OUT_DIR}"; fi
      # ⚠️ Falhar ao guardar a copia nao derruba o job: a proxima execucao so baixa mais. A chave e o hash das marcas de cada pasta.
      - name: Guardar a copia do banco do supervisorio
        if: ${{ !cancelled() && hashFiles('.cache-banco/backup-dados-scada/*.meta') != '' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .cache-banco/backup-dados-scada
          key: scada-db-gen-trafo-${{ hashFiles('.cache-banco/backup-dados-scada/*.meta') }}
      - name: Guardar a copia das planilhas do historiador
        if: ${{ !cancelled() && hashFiles('.cache-banco/scada-raw/*.meta') != '' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .cache-banco/scada-raw
          key: scada-raw-gen-trafo-${{ hashFiles('.cache-banco/scada-raw/*.meta') }}
      # 🔴 trafo-um-escritor (23/10/2026): o lado de 230 kV pelo medidor (gen-trafo-way2, `trafo_*.json`) saiu daqui. Ele roda SO no
      #    trafo-medidor.yml, de 15 em 15 min, com o forcar e o ensaio que moravam neste workflow: dois workflows gravando o mesmo
      #    `trafo_*.json` em grupos diferentes deixavam uma intradia devolver o produto velho por cima de um completo. A copia que este
      #    workflow grava chega as telas na intradia seguinte (ate 15 min).
