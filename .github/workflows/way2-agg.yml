name: Way2 Agregados (15/30/60 min)
on:
  workflow_dispatch:
    inputs:
      forcar:
        description: 'full rebuild da janela inteira (1 = sim)'
        default: 'false'
      resolucoes:
        description: 'csv de blobs para limitar (vazio = os 3)'
        default: ''
  schedule:
    - cron: '8 * * * *'  # de hora em hora, no minuto 8: depois da rodada das :05 do way2-recent (maior duracao medida
                         # 1,7 min), que grava o hist/way2_<hoje> que este le, e antes da das :10
concurrency:
  # por branch: um dispatch de outra branch (que falha na guarda do main) nao cancela nem desloca a fila do main
  group: way2-agg-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-latest
    # 🔐 SEM A CHAVE DA CONTA (plano OIDC, etapa 4, 25/10/2026). Os passos que leem ou gravam o storage de verdade levam o OIDC do
    #    proprio job: AZURE_CLIENT_ID e AZURE_TENANT_ID no env DO PASSO (identificadores, nao credenciais; as do relogio-deploy).
    #    Os ensaios sem rede ficam sem elas de proposito: ensaio que apaga a credencial no filho para simular "sem credencial" nao
    #    pode herdar o OIDC e trocar um token de verdade. `permissions` explicito zera o resto: `contents: read` e o checkout.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      # O dispatch deixa escolher a branch na tela do Actions. Fora do main o Entra recusa a troca com um AADSTS que parece
      # credencial quebrada: este passo FALHA antes, dizendo a causa (falha, nao pula: `if:` que pula esconderia o vermelho).
      # Vale para todo modo do workflow (ensaio e sonda inclusive): fora do main nao ha credencial nenhuma.
      # A ref vem da variavel de ambiente, nunca interpolada no script: nome de branch com `$(...)` viraria comando.
      - name: So roda a partir do main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::este workflow so roda a partir do main: a credencial federada vale so para o main"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: '20' }
      - run: npm i @azure/storage-blob@12
      # 💰 custo-a (17/10/2026): a copia do historico do medidor (hist/way2_<dia>) da execucao anterior. O gerador pede cada dia com
      #    If-None-Match (`lib-le-blob.js`) e o storage responde 304 sem corpo quando o dia nao mudou: antes o mesmo arquivo de ~4 MB
      #    saia do storage a cada execucao, e a saida de dados e a fatura do Azure. Sem copia (primeira vez, cache expirado), baixa tudo.
      # O ensaio da leitura condicional (sem rede): a lib que deixa de mandar o If-None-Match, ou que devolve a copia velha com
      # arquivo novo, para aqui, antes de ler qualquer dia.
      - name: Ensaio · leitura condicional do historico do medidor
        run: node scripts/ensaio-le-blob.js --so way2-agg   # a lib e a fiacao DESTE gerador; a dos outros, no ensaios.yml a cada push
      # 💰 custo-way2agg-estado (09/11/2026): a saida anterior (way2_15min/30min/1h, ~42 MB) vem pela copia compactada que a
      #    execucao anterior gravou em estado-gerador/, so se for da MESMA versao (etag); senao baixa inteira, como antes.
      #    O ensaio prova a lib e a fiacao do gerador, com plantios, sem rede.
      - name: Ensaio · copia compactada da saida anterior
        run: node scripts/ensaio-estado-gz.js
      - name: Restaurar a copia do historico do medidor
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .cache-blob
          key: hist-publico-way2-agg-${{ github.run_id }}
          restore-keys: hist-publico-way2-agg-
      - name: Gerar agregados
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          CACHE_BLOB_DIR: ${{ github.workspace }}/.cache-blob
          FORCAR: ${{ github.event.inputs.forcar }}
          RESOLUCOES: ${{ github.event.inputs.resolucoes }}
        run: node --max-old-space-size=4096 scripts/gen-way2-agg.js
      # 🔴 Selos de frescor POR FONTE: cada pagina mostra a idade da fonte que ela le, e nao a do medidor.
      #    Roda aqui, de hora em hora, porque as fontes que ele mede sao diarias/trimestrais — 5 min seria
      #    baixar 1 MB do ONS 288x/dia para nada. `if: always()`: o selo importa MAIS quando o passo
      #    anterior falhou.
      # Os dois selos dos trafos (badges_trafo = copia do supervisorio, badges_trafo_230 = diario do
      #    medidor) ensaiados sem rede, com o gerador de verdade e plantios. Vermelho aqui = o selo nao e regravado nesta rodada.
      - name: Ensaio · selos dos transformadores (sem rede)
        id: ensaio_selo
        if: always()
        run: node scripts/ensaio-trafo-way2.js --selo
      # 💰 custo-fontes-proprios (09/11/2026): as fontes que o selo le de hora em hora e que mudam 1 a 3 vezes por dia (ons_restricao_all
      #    2,7 MB, inversores 1,6 MB, way2_daily 0,85 MB, oleo; ~5 MB por rodada) pela copia em disco, confirmada pelo 304 do storage,
      #    numa entrada de cache propria (a faxina-cache apaga as superadas). As que mudam mais (irr_ufv, trafo_*, way2_saude) vem 200.
      - name: Restaurar a copia das fontes do selo
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .cache-fontes/proprios
          key: fontes-proprios-${{ github.run_id }}
          restore-keys: fontes-proprios-
      - name: Selos de frescor por fonte
        if: ${{ always() && steps.ensaio_selo.outcome == 'success' }}
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          CACHE_BLOB_DIR: ${{ github.workspace }}/.cache-fontes
          LE_DADOS_PROPRIOS: '^(ons_restricao_all|inversores|irr_ufv|way2_daily|oleo|trafo_scada_diario|trafo_diario|way2_saude)\.json$'
        run: node scripts/gen-fontes-saude.js
      - name: Guardar a copia das fontes do selo
        if: ${{ !cancelled() && hashFiles('.cache-fontes/proprios/*.meta') != '' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .cache-fontes/proprios
          key: fontes-proprios-${{ hashFiles('.cache-fontes/proprios/*.meta') }}
      # ⚠️ Falhar ao guardar a copia nao derruba o job: a proxima execucao so baixa mais. A chave e o hash das marcas: execucao sem
      #    dia novo nao regrava o cache.
      - name: Guardar a copia do historico do medidor
        if: ${{ !cancelled() && hashFiles('.cache-blob/publico/*.meta') != '' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .cache-blob
          key: hist-publico-way2-agg-${{ hashFiles('.cache-blob/publico/*.meta') }}
