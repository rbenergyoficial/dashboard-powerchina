name: Way2 Agregados (15/30/60 min)
on:
  workflow_dispatch:
    inputs:
      forcar:
        description: 'full rebuild da janela inteira (1 = sim)'
        default: 'false'
      resolucoes:
        description: 'csv de blobs para limitar (vazio = os 3)'
        default: ''
  schedule:
    - cron: '5 * * * *'
concurrency:
  group: way2-agg
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-latest
    env:   # Fase 2 (PROMOVER fase2-virada): toda leitura de `dados` pela lib-le-dados com credencial, em todo passo do job
      DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i @azure/storage-blob@12
      # 💰 custo-a (17/10/2026): a copia do historico do medidor (hist/way2_<dia>) da execucao anterior. O gerador pede cada dia com
      #    If-None-Match (`lib-le-blob.js`) e o storage responde 304 sem corpo quando o dia nao mudou: antes o mesmo arquivo de ~4 MB
      #    saia do storage a cada execucao, e a saida de dados e a fatura do Azure. Sem copia (primeira vez, cache expirado), baixa tudo.
      # O ensaio da leitura condicional (sem rede): a lib que deixa de mandar o If-None-Match, ou que devolve a copia velha com
      # arquivo novo, para aqui, antes de ler qualquer dia.
      - name: Ensaio · leitura condicional do historico do medidor
        run: node scripts/ensaio-le-blob.js
      - name: Restaurar a copia do historico do medidor
        uses: actions/cache/restore@v4
        with:
          path: .cache-blob
          key: hist-publico-way2-agg-${{ github.run_id }}
          restore-keys: hist-publico-way2-agg-
      - name: Gerar agregados
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          CACHE_BLOB_DIR: ${{ github.workspace }}/.cache-blob
          FORCAR: ${{ github.event.inputs.forcar }}
          RESOLUCOES: ${{ github.event.inputs.resolucoes }}
        run: node --max-old-space-size=4096 scripts/gen-way2-agg.js
      # 🔴 Selos de frescor POR FONTE (Lote B, 06/09/2026): o cabecalho de seis paginas dizia
      #    "11 min · 24/24" (Way2) sobre dado de trafo com 2,7 dias e de oleo com 75. Roda aqui,
      #    de hora em hora, porque as fontes que ele mede sao diarias/trimestrais — 5 min seria
      #    baixar 1 MB do ONS 288x/dia para nada. `if: always()`: o selo importa MAIS quando o passo
      #    anterior falhou.
      # lote fonte-trafo-way2 (19/10/2026): os dois selos dos trafos (badges_trafo = copia do supervisorio, badges_trafo_230 = diario do
      #    medidor) ensaiados sem rede, com o gerador de verdade e plantios. Vermelho aqui = o selo nao e regravado nesta rodada.
      - name: Ensaio · selos dos transformadores (sem rede)
        id: ensaio_selo
        if: always()
        run: node scripts/ensaio-trafo-way2.js --selo
      - name: Selos de frescor por fonte
        if: ${{ always() && steps.ensaio_selo.outcome == 'success' }}
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
        run: node scripts/gen-fontes-saude.js
      # ⚠️ Falhar ao guardar a copia nao derruba o job: a proxima execucao so baixa mais. A chave e o hash das marcas: execucao sem
      #    dia novo nao regrava o cache.
      - name: Guardar a copia do historico do medidor
        if: ${{ !cancelled() && hashFiles('.cache-blob/publico/*.meta') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache-blob
          key: hist-publico-way2-agg-${{ hashFiles('.cache-blob/publico/*.meta') }}
