name: Way2 · energia do mês e demanda do mês (substituto do fluxo do Power Automate)

# Substitui o fluxo "Way2 → Azure Blob Sync" do Power Automate (10 min), que sai com o Premium em 09/11/2026: as mesmas tres
# chamadas, gravando way2_energia_mes.json, way2_energia_antmes.json e way2_must.json com o corpo da resposta como veio.
#
# 🔴 GRAVA desde o PROMOVER pa-way2-mes (20/10/2026): a sombra (pa-way2-mes-sombra, 18/10) rodou 300 vezes em 48 h, todas verdes,
# com 549 ponto x dia iguais nos tres blobs e nenhum dia fechado diferente. O fluxo do Power Automate e desligado no mesmo ato
# (um escritor so por blob). SOMBRA=1 continua valendo para comparar a mao.
on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'  # a cada 10 min, fora do :00
  workflow_dispatch: {}
concurrency:
  group: gen-way2-mes
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  gen:
    runs-on: ubuntu-latest
    env:   # Fase 2 (PROMOVER fase2-virada): toda leitura de `dados` pela lib-le-dados com credencial, em todo passo do job
      DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Ensaio do substituto (forma, comparacao, sombra e gravacao)
        run: node scripts/ensaio-way2-mes.js
      - run: npm i @azure/storage-blob@12
      - name: Energia e demanda do mes (grava os tres blobs)
        env:
          WAY2_TOKEN: ${{ secrets.WAY2_TOKEN }}
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
        run: node scripts/gen-way2-mes.js
