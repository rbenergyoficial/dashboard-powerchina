name: Way2 · energia do mês e demanda do mês (substituto do fluxo do Power Automate)

# Tres chamadas a Way2, gravando way2_energia_mes.json, way2_energia_antmes.json e way2_must.json com o corpo da resposta como
# veio. Um escritor so por blob. SOMBRA=1 compara com o publicado sem gravar.
on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'  # a cada 10 min, fora do :00
  workflow_dispatch: {}
concurrency:
  # por branch: um dispatch de outra branch (que falha na guarda do main) nao cancela nem desloca a fila do main
  group: gen-way2-mes-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  gen:
    runs-on: ubuntu-latest
    # 🔐 SEM A CHAVE DA CONTA (plano OIDC, etapa 4, 25/10/2026). Os passos que leem ou gravam o storage de verdade levam o OIDC do
    #    proprio job: AZURE_CLIENT_ID e AZURE_TENANT_ID no env DO PASSO (identificadores, nao credenciais; as do relogio-deploy).
    #    Os ensaios sem rede ficam sem elas de proposito: ensaio que apaga a credencial no filho para simular "sem credencial" nao
    #    pode herdar o OIDC e trocar um token de verdade. `permissions` explicito zera o resto: `contents: read` e o checkout.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      # O dispatch deixa escolher a branch na tela do Actions. Fora do main o Entra recusa a troca com um AADSTS que parece
      # credencial quebrada: este passo FALHA antes, dizendo a causa (falha, nao pula: `if:` que pula esconderia o vermelho).
      # Vale para todo modo do workflow (ensaio e sonda inclusive): fora do main nao ha credencial nenhuma.
      # A ref vem da variavel de ambiente, nunca interpolada no script: nome de branch com `$(...)` viraria comando.
      - name: So roda a partir do main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::este workflow so roda a partir do main: a credencial federada vale so para o main"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: '20' }
      - name: Ensaio do substituto (forma, comparacao, sombra e gravacao)
        run: node scripts/ensaio-way2-mes.js
      - run: npm i @azure/storage-blob@12
      - name: Energia e demanda do mes (grava os tres blobs)
        env:
          WAY2_TOKEN: ${{ secrets.WAY2_TOKEN }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: node scripts/gen-way2-mes.js
