name: Way2 Recent (snapshot + rolante · 5 min)
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
  # ⚠️ o canal de alerta novo abre ISSUE no proprio repositorio — sem isto ele falha com 403,
  #    e canal de alerta que falha e o pior lugar para uma permissao faltando.
  issues: write
concurrency:
  group: way2-recent
  cancel-in-progress: true
jobs:
  recent:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i @azure/storage-blob@12
      # 🔴 A COLETA. Ate aqui `way2_eletrico.json` era o unico blob que nascia FORA do GitHub:
      # quem o escrevia era o fluxo do Power Automate "Way2 Eletrico 5min", e todo o ao-vivo
      # deriva dele. Isso prendia a entrada de dado a uma licenca Premium com prazo. O repo ja
      # tinha o segredo e o gen-must ja falava com a mesma API — faltava a coleta de 5 min.
      #
      # 🔴 SEM `continue-on-error`: a falha tem de ser RUIDOSA. Com ele, um passo que falha
      # aparece como `success` na API do GitHub, e o verde do workflow nao provava que a coleta
      # funcionava — quem provava era o blob. Ele existia enquanto o fluxo do Power Automate
      # fosse a rede de seguranca; a partir do desligamento do fluxo, esta e a UNICA entrada de
      # dado do ao-vivo, e ela nao pode parar em silencio.
      - name: Coletar da Way2 (way2_eletrico.json)
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          WAY2_TOKEN: ${{ secrets.WAY2_TOKEN }}
        run: node scripts/gen-way2-eletrico.js

      - name: Snapshot hoje + way2_recent.json
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
        run: node scripts/gen-way2-recent.js
      # O executivo declara 15 execucoes/dia no cron e o agendador do GitHub entrega 5,6
      # (medido em 45 execucoes: mediana de 91 min entre elas, p90 de 615). Este passo custa
      # uma leitura e uma escrita e mantem SO a linha do dia em curso fresca, na cadencia de
      # 5 min deste job. Grava com If-Match: se o executivo reescrever o blob no meio, ele
      # desiste e a proxima rodada refaz sobre o estado novo.
      - name: Dia em curso no executivo.json
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
        run: node scripts/gen-dia-corrente.js
      # As perdas de PV alimentam o card de cobertura da medicao, e o `perdas.yml` declara
      # uma execucao por dia no cron — que o agendador do GitHub as vezes simplesmente nao
      # entrega (nao rodou em 31/08). Aqui ele e coberto pelo job que roda de verdade, mas
      # SO quando o resultado ja esta velho: o passo custa ~3 min e nao pode sair a cada
      # cinco minutos. A guarda trata 404 e erro como velho — nao gerar custa um dia de
      # pagina parada, gerar a toa custa tres minutos.
      - name: O blob de perdas está velho?
        id: idade_perdas
        run: node scripts/idade-blob.js perdas_diario.json 3 5
      - name: Perdas de PV (cobre o agendador)
        if: steps.idade_perdas.outputs.velho == 'true'
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
        run: node scripts/gen-perdas.js
      # 🔴 A REGRA DE COR DO SELO ESTA DUPLICADA no ensaio, porque o gerador nao a exporta. Divida
      # assumida — e esta e a guarda contra ela apodrecer: o ensaio confere os sete casos sinteticos
      # (incluindo o de 23/08, dois medidores de 230 kV fora) e depois compara o proprio resultado
      # com o selo que o gerador ACABOU de gravar. Se as duas regras divergirem, o job fica vermelho
      # em vez de o painel passar a mentir em silencio.
      - name: Ensaio do selo de medidores
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
        run: node scripts/ensaio-selo-medidores.js --real
      # 🔴 O RELOGIO PARANDO NAO FAZ BARULHO. Ele dispara os workflows na cadencia dos crons
      # porque o agendador do GitHub entrega ~1/3 do declarado; se o PAT expirar ou o Function
      # App cair, nada fica vermelho — a suite so fica velha. Este vigia compara a idade da
      # ultima execucao de cada workflow com o MAIOR intervalo que o proprio cron dele produz.
      # E cobre tambem o caso que o job nao cobre sozinho: o job nao RODAR.
      - name: Vigia de cadencia (o relogio esta tocando?)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          PA_ALERT_WEBHOOK: ${{ secrets.PA_ALERT_WEBHOOK }}
        run: node scripts/gen-relogio-watchdog.js
      # 🔴 SEGUNDO DESTINO. Este vigia falava so pelo webhook do Power Automate — ou seja, o vigia
      # da UNICA entrada de dado do ao-vivo tinha um canal so, e esse canal morre com a licenca.
      # `GITHUB_TOKEN` + `GH_REPO` ligam a issue no proprio repositorio, que nao depende de licenca
      # nenhuma. O webhook continua enquanto existir: o segundo destino SOMA, nao substitui.
      - name: Watchdog frescor Way2 (alerta)
        if: always()
        env:
          DADOS_STORAGE: ${{ secrets.DADOS_STORAGE }}
          WAY2_TOKEN: ${{ secrets.WAY2_TOKEN }}
          PA_ALERT_WEBHOOK: ${{ secrets.PA_ALERT_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          LIMIAR_MIN: '30'
        run: node scripts/gen-way2-watchdog.js
