<!doctype html>
<html lang="en" data-modo="tela">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITULO__</title>
<style>
/* Boletim de Desempenho · tela executiva (modelo; o tela.py injeta o dado do dia, a fonte e o logotipo). Arquivo ÚNICO, sem nada de fora:
   abre sem rede (a fonte Archivo, licença SIL OFL 1.1, vai embutida). Página editorial de uma coluna, sem cartões. O "instrumento do dia"
   ocupa a largura toda (curva, irradiância e as nove usinas na mesma régua de tempo); abaixo, pares de gráficos separados por fio. Uma
   família (Archivo) em duas larguras: normal no texto, condensada em rótulo e eixo. Cores só do aurora.json. */
@font-face{font-family:"Archivo";font-style:normal;font-weight:300 800;font-stretch:62% 125%;font-display:swap;src:url(data:font/woff2;base64,__FONTE__) format("woff2")}
@page{margin:0}
:root{
  --bg:#FFFFFF; --sunk:#F2F4F7; --ink:#05070A; --ink2:#232A33; --ink3:#434B57; --ink4:#6E7683; --line:#DFE3E8; --line2:#C3CAD3;
  --ger:#BF7E04; --cx:#B85137; --ppa:#498DF2; --corte:#7A6FB5; --ok:#43966B; --ruim:#E02F44;
  --m1:#B6056C; --m2:#A58C03; --m3:#22907C; --m4:#4E5435; --m5:#AB43D0; --m6:#B08374; --m7:#9E84A6; --m8:#7453FE; --m9:#049AA4;
  --f:"Archivo","Segoe UI",system-ui,-apple-system,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0A0B0D; --sunk:#111317; --ink:#FAFBFC; --ink2:#DCE1E8; --ink3:#A3ABB8; --ink4:#8B93A1; --line:#25272C; --line2:#3A3E46;
  --ger:#F5A623; --cx:#B85137; --ppa:#498DF2; --corte:#A79BE8; --ok:#2BB673; --ruim:#E02F44;
  --m1:#F0509C; --m2:#F3D020; --m3:#01816E; --m4:#DBE3BF; --m5:#AB43D0; --m6:#C79889; --m7:#DABFE3; --m8:#7453FE; --m9:#2CDBE8; color-scheme:dark}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.pg{max-width:1180px;margin:0 auto}
.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 16px;flex-wrap:wrap;padding-block:22px 12px;border-bottom:1px solid var(--ink)}
.marca{font-size:13px;color:var(--ink3);letter-spacing:.02em}
.marca .lg{display:inline-block;line-height:0;margin-bottom:7px}
.marca img{display:block;height:36px;width:auto}
:root[data-theme="dark"] .marca .lg{background:#FFFFFF;padding:6px 10px;border-radius:4px}
.marca span{display:block}
.mast-d{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;justify-content:flex-end;color:var(--ink3);font-size:13px}
.ctl{display:flex;gap:10px}
[data-modo="foto"] .ctl{display:none}
.pend{display:inline-block;margin-left:10px;padding:2px 9px;border:1px solid color-mix(in srgb,var(--corte) 60%,transparent);background:color-mix(in srgb,var(--corte) 14%,transparent);
  color:color-mix(in srgb,var(--corte) 55%,var(--ink));border-radius:3px;letter-spacing:.06em;white-space:nowrap}
.nota{font-size:12.5px;color:var(--ink3);margin:8px 0 0;max-width:62em}
.nota i{display:inline-block;width:12px;height:12px;margin-right:7px;vertical-align:-1px;background:repeating-linear-gradient(45deg,var(--corte) 0 2px,transparent 2px 5px)}
.kv.tx{font-size:clamp(17px,1.7vw,21px);white-space:normal;line-height:1.25;padding-block:4px}
.lng{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.lng button{font:inherit;font-size:12px;font-weight:600;letter-spacing:.06em;padding:4px 10px;background:transparent;color:var(--ink3);border:0;cursor:pointer}
.lng button[aria-pressed="true"]{background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink)}
.lng button:focus-visible{outline:2px solid var(--ppa);outline-offset:-2px}
.ico{display:inline-flex;align-items:center;justify-content:center;width:31px;height:27px;padding:0;background:transparent;color:var(--ink2);border:1px solid var(--line2);border-radius:3px;cursor:pointer}
.ico:hover{background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink)}
.ico:focus-visible{outline:2px solid var(--ppa);outline-offset:1px}
.ico svg{display:block;width:16px;height:16px}
html:lang(zh-Hans){--f:"Archivo","PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",system-ui,-apple-system,sans-serif}
.ante{margin:26px 0 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600}
h1{font-size:clamp(25px,3.6vw,40px);line-height:1.12;font-weight:700;letter-spacing:-.015em;margin:0;max-width:22em;text-wrap:balance;font-stretch:94%}
.kp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin-top:26px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kp>div{padding:14px 14px 15px 0;min-width:0}
.kp>div+div{padding-left:14px;border-left:1px solid var(--line)}
.kr{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600;font-stretch:88%}
.kv{font-size:clamp(23px,2.45vw,31px);font-weight:600;line-height:1.1;letter-spacing:-.02em;margin-top:5px;white-space:nowrap;font-stretch:90%}
.kv small{font-size:.42em;font-weight:500;letter-spacing:0;color:var(--ink3);margin-left:5px}
.kv i{font-style:normal;color:var(--line2);font-weight:300;margin:0 .22em}
.ks{font-size:13px;color:var(--ink3);margin-top:4px;line-height:1.4}
.ks b{font-weight:600;color:var(--ink2)}
.ks .up{color:var(--ok);font-weight:700} .ks .dn{color:var(--ruim);font-weight:700}
section{margin-top:40px}
.par{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 44px;margin-top:0}
.par>section{border-top:1px solid var(--line);padding-top:18px}
.cheio{border-top:1px solid var(--line);padding-top:18px}
h2{font-size:19px;line-height:1.25;font-weight:700;margin:0;letter-spacing:-.005em;text-wrap:balance;max-width:38em}
.sub{font-size:13px;color:var(--ink3);margin:5px 0 12px;max-width:62em}
.leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--ink3);margin:0 0 6px;font-stretch:88%}
.leg span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.leg i{display:inline-block;width:12px;height:12px;flex:none}
.g{position:relative;touch-action:pan-y}
.g svg{display:block;width:100%;overflow:visible}
svg text{font-family:var(--f);font-stretch:82%;font-size:11.5px;fill:var(--ink3)}
svg text.hal{paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round}
svg text.v{fill:var(--ink);font-weight:600} svg text.n{fill:var(--ink2)} svg text.t13{font-size:13px} svg text.b{font-weight:700;fill:var(--ink)}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--sunk);border:1px solid var(--line2);padding:9px 11px;font-size:12.5px;line-height:1.5;
  min-width:150px;max-width:260px;box-shadow:0 6px 22px rgba(0,0,0,.18);color:var(--ink2)}
#tip b{color:var(--ink);font-weight:700} #tip .h{font-weight:700;color:var(--ink);margin-bottom:3px;font-size:12px;letter-spacing:.04em}
#tip table{border-collapse:collapse;width:100%} #tip td{padding:0 0 0 0} #tip td+td{text-align:right;padding-left:14px;color:var(--ink);font-weight:600}
#tip .gr{display:grid;grid-template-columns:repeat(3,auto);gap:0 12px;margin-top:5px;padding-top:5px;border-top:1px solid var(--line);font-size:11.5px}
.rod{margin-top:44px;border-top:1px solid var(--ink);padding-top:10px;font-size:12px;color:var(--ink3);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.rod p{margin:0;max-width:70em}
.meta{display:grid;grid-template-columns:236px 236px minmax(0,1fr);gap:0 26px;align-items:center}
.meta>div{min-width:0}
.sp{height:30px;margin-top:9px}
.sp svg{display:block;width:100%;overflow:visible}
@media (max-width:900px){.meta{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px} .meta>#g-leq{grid-column:1/-1}}
@keyframes risca{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes surge{from{opacity:0}to{opacity:1}}
@keyframes cresce{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes estica{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.anim .risca{stroke-dasharray:1;animation:risca 1.5s cubic-bezier(.4,0,.2,1) backwards}
.anim .surge{animation:surge .5s ease backwards}
.anim .cresce{transform-box:fill-box;transform-origin:50% 100%;animation:cresce .7s cubic-bezier(.2,.7,.2,1) backwards}
.anim .estica{transform-box:fill-box;transform-origin:0 50%;animation:estica .8s cubic-bezier(.2,.7,.2,1) backwards}
@media (prefers-reduced-motion: reduce){.anim .risca,.anim .surge,.anim .cresce,.anim .estica{animation:none}}
@media (max-width:1000px){.kp{grid-template-columns:repeat(3,minmax(0,1fr))} .kp>div:nth-child(3n+1){border-left:0;padding-left:0} .kp>div:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:900px){.par{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.kp{grid-template-columns:repeat(2,minmax(0,1fr))} .kp>div:nth-child(even){border-left:1px solid var(--line);padding-left:12px} .kp>div:nth-child(odd){border-left:0;padding-left:0}
  .kp>div:nth-child(n+3){border-top:1px solid var(--line)} .kv{white-space:normal} .pend{margin:6px 0 0;display:table}
  .meta{grid-template-columns:minmax(0,1fr)}}
@media print{.ctl{display:none} #tip{display:none} body{padding-bottom:24px}}
</style>
</head>
<body>
<div class="pg anim" id="pg">
  <header class="mast">
    <div class="marca"><span class="lg"><img alt="Intrepid Participações S.A." src="data:image/png;base64,__LOGO__"></span><span id="m-sub"></span></div>
    <div class="mast-d"><span id="m-data"></span>
      <div class="ctl"><button id="b-tema" class="ico" type="button"></button>
      <div class="lng" role="group" aria-label="Language"><button id="b-pt" type="button">PT</button><button id="b-en" type="button">EN</button><button id="b-zh" type="button" lang="zh-Hans">中文</button></div></div></div>
  </header>
  <p class="ante" id="ante"></p>
  <h1 id="h1"></h1>
  <div class="kp" id="kp"></div>

  <section class="cheio"><h2 id="t-dia"></h2><p class="sub" id="s-dia"></p><div class="leg" id="l-dia"></div><div class="g" id="g-dia"></div></section>
  <section class="cheio"><h2 id="t-leq"></h2><p class="sub" id="s-leq"></p><div class="leg" id="l-leq"></div>
    <div class="meta"><div class="g" id="g-gcx"></div><div class="g" id="g-gpp"></div><div class="g" id="g-leq"></div></div></section>
  <div class="par" style="margin-top:40px">
    <section style="margin-top:0"><h2 id="t-pon"></h2><p class="sub" id="s-pon"></p><div class="g" id="g-pon"></div><p class="nota" id="n-pon" hidden></p></section>
    <section style="margin-top:0"><h2 id="t-mes"></h2><p class="sub" id="s-mes"></p><div class="leg" id="l-mes"></div><div class="g" id="g-mes"></div></section>
  </div>
  <section class="cheio"><h2 id="t-usi"></h2><p class="sub" id="s-usi"></p><div class="leg" id="l-usi"></div><div class="g" id="g-usi"></div></section>
  <footer class="rod"><p id="rod1"></p><p id="rod2"></p></footer>
</div>
<div id="tip" hidden></div>
<script id="dados" type="application/json">__DADOS__</script>
<script>
(function(){
'use strict';
var D = JSON.parse(document.getElementById('dados').textContent);
/* língua e tema: o endereço (?lang=pt|en&theme=dark|light) manda; depois a escolha guardada do leitor; depois o padrão do arquivo
   (ao grupo vai o inglês no escuro). No modo foto (a imagem e o PDF do envio) vale só o padrão do arquivo, sem animação. */
var RAIZ = document.documentElement, FOTO = RAIZ.getAttribute('data-modo') === 'foto';
var q = new URLSearchParams(location.search);
function guardado(k){ if (FOTO) return null; try { return localStorage.getItem(k); } catch (e) { return null; } }
function um(lista, cand){ for (var i = 0; i < cand.length; i++) if (lista.indexOf(cand[i]) >= 0) return cand[i]; return lista[0]; }
var LANG = um(['en','pt','zh'], [q.get('lang'), guardado('bolLang'), D.padrao && D.padrao.lang]);
var TEMA = um(['dark','light'], [q.get('theme'), guardado('bolTema'), D.padrao && D.padrao.tema]);
RAIZ.setAttribute('data-theme', TEMA);
if (FOTO) document.getElementById('pg').classList.remove('anim');
var FALTA = 0;   /* textos pedidos em chinês sem o chinês escrito: a guarda (tela.py) recusa se houver */
function L(pt, en, zh){ if (LANG === 'zh'){ if (zh == null){ FALTA++; return en; } return zh; } return LANG === 'pt' ? pt : en; }
var ICO_SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7"/></svg>';
var ICO_LUA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.2A8.3 8.3 0 0 1 9.8 4a8.3 8.3 0 1 0 10.2 10.2z"/></svg>';
function nf(v, c){ if (v == null || isNaN(v)) return '—'; c = c == null ? 2 : c; return Number(v).toLocaleString(LANG === 'pt' ? 'pt-BR' : 'en-US', {minimumFractionDigits:c, maximumFractionDigits:c}); }
function pc(v, c){ return nf(v, c == null ? 1 : c) + (LANG === 'pt' ? ' %' : '%'); }
var MES_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MES_PT = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var MES_ENL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var MM = Number(D.dia.slice(5,7)), AA = D.dia.slice(0,4), DD = D.D, NT = D.NT;
function fd(d){ return LANG === 'pt' ? String(d).padStart(2,'0') + '/' + String(MM).padStart(2,'0') : LANG === 'zh' ? MM + '月' + d + '日' : d + ' ' + MES_EN[MM-1]; }
function mesNome(){ return LANG === 'pt' ? MES_PT[MM-1] : LANG === 'zh' ? MM + '月' : MES_ENL[MM-1]; }
function Mes(){ var s = mesNome(); return s.charAt(0).toUpperCase() + s.slice(1); }
function $(id){ return document.getElementById(id); }
function r1(v){ return Math.round(v * 10) / 10; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function mix(c, p, base){ return 'color-mix(in srgb,' + c + ' ' + p + '%,' + (base || 'transparent') + ')'; }
function heat(p){ return mix('var(--ger)', Math.round(5 + 95 * Math.max(0, Math.min(1, p))), 'var(--sunk)'); }
function mono(pts){
  var n = pts.length, i; if (n < 3) return 'M' + pts.map(function(p){ return r1(p[0]) + ',' + r1(p[1]); }).join('L');
  var dx = [], m = [], t = [];
  for (i = 0; i < n-1; i++){ dx[i] = pts[i+1][0] - pts[i][0]; m[i] = (pts[i+1][1] - pts[i][1]) / dx[i]; }
  t[0] = m[0]; t[n-1] = m[n-2];
  for (i = 1; i < n-1; i++) t[i] = m[i-1] * m[i] <= 0 ? 0 : (m[i-1] + m[i]) / 2;
  for (i = 0; i < n-1; i++){ if (m[i] === 0){ t[i] = 0; t[i+1] = 0; continue; } var a = t[i]/m[i], b = t[i+1]/m[i], s = a*a + b*b; if (s > 9){ var k = 3/Math.sqrt(s); t[i] = k*a*m[i]; t[i+1] = k*b*m[i]; } }
  var d = 'M' + r1(pts[0][0]) + ',' + r1(pts[0][1]);
  for (i = 0; i < n-1; i++){ var h = dx[i]/3; d += 'C' + r1(pts[i][0]+h) + ',' + r1(pts[i][1]+h*t[i]) + ' ' + r1(pts[i+1][0]-h) + ',' + r1(pts[i+1][1]-h*t[i+1]) + ' ' + r1(pts[i+1][0]) + ',' + r1(pts[i+1][1]); }
  return d;
}
/* ---------- balão ---------- */
var tip = $('tip');
function showTip(ev, html){ tip.innerHTML = html; tip.hidden = false; var w = tip.offsetWidth, h = tip.offsetHeight, x = ev.clientX + 16, y = ev.clientY - h - 14;
  if (x + w > innerWidth - 8) x = ev.clientX - w - 16; if (x < 8) x = 8; if (y < 8) y = ev.clientY + 18; tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
function hideTip(){ tip.hidden = true; }
function liga(el, fn, sai){ el.addEventListener('pointermove', fn); el.addEventListener('pointerdown', fn); el.addEventListener('pointerleave', function(){ hideTip(); if (sai) sai(); }); }

/* ---------- o que o dia diz (tudo do dado) ---------- */
var US = ['M1','M2','M3','M4','M5','M6','M7','M8','M9'];
var NS = D.slots.length, T0 = 300, T1 = T0 + NS * 30;
var GER = D.cx_mw.map(function(v){ return Math.max(0, v || 0); });
/* ---------- o estado do ONS no dia: um só para o título, o número, a curva, a ponte, o dia a dia e o PR ----------
   'publicado' (o ONS apurou o dia) · 'ordens' (pendente, com tempo sob ordem registrada pela Iqony) · 'nenhuma' (pendente, registro sem
   ordem) · 'sem_registro' (pendente, sem o registro). O diário das 08:00 é sempre pendente: nesses três estados a tela não mostra
   limite, potencial nem energia não gerada do ONS, e nunca diz que o dia foi "sem limite". */
var EST = D.ons.estado, PUB = EST === 'publicado', IQ = D.ons.iq, DEG = PUB ? [] : (D.ons.degraus || []);
var PARADO = !PUB && IQ && IQ.coletor === 'parado';
var TEMPOT = PUB && D.LD.pr != null;   /* o potencial pela irradiância usa o PR do dia FORA do limite, que só existe com o ONS publicado */
var POT = D.irr.map(function(v){ return TEMPOT ? Math.min(D.placa_total * (v || 0) / 1000 * D.LD.pr, 343.77) : 0; });
var LIM = D.lim, iLim = []; if (PUB) LIM.forEach(function(v, i){ if (v != null) iLim.push(i); });
function hm(m){ return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); }
var JAN = iLim.length ? [T0 + iLim[0]*30, T0 + (iLim[iLim.length-1] + 1)*30] : null;
var iPico = GER.indexOf(Math.max.apply(null, GER));
var limV = iLim.map(function(i){ return Math.round(LIM[i]); }), limMin = limV.length ? Math.min.apply(null, limV) : null, limMax = limV.length ? Math.max.apply(null, limV) : null;
var JORD = DEG.length ? [DEG[0][0], DEG[DEG.length-1][1]] : null;   /* a janela das ordens da Iqony (minutos do dia) */
var MESD = D.mes, HOJE = MESD[MESD.length-1];
var PEND = MESD.filter(function(m){ return !m.ons; }).map(function(m){ return Number(m.d.slice(8)); });   /* os dias do mês que o ONS ainda não publicou */
var ULT = D.ons.ult ? Number(D.ons.ult.slice(8)) : null;   /* o último dia do mês que o ONS publicou */
var cortDia = PUB ? (HOJE.cort || 0) : null;
var pos = 1 + MESD.filter(function(m){ return m.liq > D.liq; }).length;
var dif = (D.liq / D.meta_d - 1) * 100;
var acima = MESD.filter(function(m){ return m.liq >= m.meta; }).length;
var cumC = [], cumP = [], a = 0, b = 0; MESD.forEach(function(m){ a += m.liq; b += m.ppa; cumC.push(a / D.cx.meta * 100); cumP.push(b / D.pp.meta * 100); });
var ritmo = DD / NT * 100, metaPer = D.meta_d * DD;
var p50 = D.p50_mes_ate, ent = D.cx.tot, cor = D.imp_mes, out = p50 - cor - ent;
var p75 = p50 * D.p75_fator, p90 = p50 * D.p90_fator;   /* o estudo dá o P75 e o P90 do ano; o período sai na mesma proporção do P50 (padrão do painel executivo) */
var uDia = {}, uRend = {}; US.forEach(function(u){ uDia[u] = D.us_dia[u][DD-1]; uRend[u] = uDia[u] / D.placa[u]; });

    '<text class="n" x="' + cx + '" y="' + r1(cy + R * .80) + '" text-anchor="middle">' + nf(r.tot) + ' MWh</text>';
  s += '<text class="n" x="' + cx + '" y="' + (S + 14) + '" text-anchor="middle">' + L('projeção ','projection ','预测 ') + pc(r.proj_pct) + ' · ' + L('faixa ','band ','区间 ') + nf(r.proj_pct - e, 0) + '–' + pc(r.proj_pct + e, 0) + '</text>' +
    '<text class="b t13" x="' + cx + '" y="' + (S + 32) + '" text-anchor="middle">' + (estMeta(r) === 'bateu' ? L('meta batida em ','target reached on ','目标已完成：') + fd(Number(r.bateu.slice(8))) : estMeta(r) === 'prev' ? L('deve bater a meta em ','set to reach target on ','预计完成目标：') + fd(r.prev) : L('no ritmo atual não bate a meta','at the current pace it misses the target','按当前进度无法完成目标')) + '</text>';
  s += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="transparent"/></svg>';
  el.innerHTML = s;
  liga(el.querySelector('svg'), function(ev){ showTip(ev, '<div class="h">' + esc(nome) + ' · ' + mesNome() + '</div><table><tr><td>' + L('Entregue','Delivered','已送出') + '</td><td>' + nf(r.tot) + ' MWh</td></tr><tr><td>' + L('Meta do mês','Month target','当月目标') + '</td><td>' + nf(r.meta) +
    ' MWh</td></tr><tr><td>' + L('Falta','To go','差额') + '</td><td>' + nf(Math.max(0, r.meta - r.tot)) + ' MWh</td></tr><tr><td>' + L('Ritmo linear','Linear pace','线性进度') + '</td><td>' + pc(ritmo) + '</td></tr><tr><td>' + L('Projeção','Projection','预测') + '</td><td>' + pc(r.proj_pct) + '</td></tr></table>'); });
}
function gArcos(){ gArco('g-gcx', D.cx, 'var(--cx)', L('Complexo','Complex','电站群'), 0); gArco('g-gpp', D.pp, 'var(--ppa)', 'PPA', 1); }

/* ---------- 5. PR por usina nos dias sem corte: marcador redondo em torno do complexo ---------- */
function gUsinas(){
  var el = $('g-usi'), W = el.clientWidth, peq = W < 560, Lm = peq ? 34 : 92, Rm = peq ? 6 : 18, top = 34, hh = 196, n = US.length, yT = top + hh + 30, H = yT + 30, pw = W - Lm - Rm;
  if (!LIV.length){   /* nenhum dia apurado sem energia impedida: só o fator de capacidade e a disponibilidade do mês, sem PR inventado */
    var s0 = '<svg viewBox="0 0 ' + W + ' 96" height="96" role="img" aria-label="' + esc($('t-usi').textContent) + '">', b0 = pw / n;
    if (!peq) s0 += '<text x="0" y="62" style="font-size:11px">' + L('FC do mês','Month CF','本月 CF') + '</text><text x="0" y="80" style="font-size:11px">' + L('Disponibilidade','Availability','可用率') + '</text>';
    US.forEach(function(u, i){ var x = Lm + b0 * (i + .5), c = 'var(--' + u.toLowerCase() + ')';
      s0 += '<circle cx="' + r1(x) + '" cy="22" r="' + (peq ? 13 : 17) + '" fill="' + mix(c, 26, 'var(--bg)') + '" stroke="' + c + '" stroke-width="1.7"/><text class="b" x="' + r1(x) + '" y="26" text-anchor="middle" style="font-size:' + (peq ? 10.5 : 12) + 'px">' + u + '</text>' +
        '<text class="n" x="' + r1(x) + '" y="62" text-anchor="middle">' + (peq ? nf(uFCm[u], 1) : pc(uFCm[u])) + '</text><text class="n" x="' + r1(x) + '" y="80" text-anchor="middle">' + (peq ? nf(trunc2(D.disp_us_mes[u]), 2) : pc(trunc2(D.disp_us_mes[u]), 2)) + '</text>'; });
    el.innerHTML = s0 + '</svg>'; return; }
  var vs = US.map(function(u){ return D.pr_us_livre[u]; }).concat([D.pr_cx_livre]), mn = Math.floor((Math.min.apply(null, vs) - 2.5) / 5) * 5, mx = Math.ceil((Math.max.apply(null, vs) + 2.5) / 5) * 5;
  var Y = function(v){ return top + hh - (v - mn) / (mx - mn) * hh; }, bw = pw / n, ref = D.pr_cx_livre, yr = Y(ref), rb = peq ? 13 : 17;
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" height="' + H + '" role="img" aria-label="' + esc($('t-usi').textContent) + '">';
  for (var v = mn; v <= mx; v += 5) s += '<line x1="' + Lm + '" x2="' + (Lm + pw) + '" y1="' + r1(Y(v)) + '" y2="' + r1(Y(v)) + '" stroke="var(--line)" stroke-width=".8"/><text x="' + (Lm - 8) + '" y="' + r1(Y(v) + 4) + '" text-anchor="end">' + v + '%</text>';
  s += '<line x1="' + Lm + '" x2="' + (Lm + pw) + '" y1="' + r1(yr) + '" y2="' + r1(yr) + '" stroke="var(--ink3)" stroke-width="1.4"/><text class="n hal t13" x="' + (Lm + pw) + '" y="' + r1(yr - 7) + '" text-anchor="end">' + L('Complexo ','Complex ','电站群 ') + pc(ref) + '</text>';
  if (!peq) s += '<text x="0" y="' + yT + '" style="font-size:11px">' + L('FC do mês','Month CF','本月 CF') + '</text><text x="0" y="' + (yT + 18) + '" style="font-size:11px">' + L('Disponibilidade','Availability','可用率') + '</text>';
  ordLiv.forEach(function(u, i){ var x = Lm + bw * (i + .5), b = D.pr_us_livre[u], y = Y(b), c = 'var(--' + u.toLowerCase() + ')', ac = b >= ref;
    s += '<line class="surge" style="animation-delay:' + (i * 70) + 'ms" x1="' + r1(x) + '" x2="' + r1(x) + '" y1="' + r1(yr) + '" y2="' + r1(y) + '" stroke="' + mix(c, 75) + '" stroke-width="2"/>' +
      '<circle class="surge" style="animation-delay:' + (i * 70 + 250) + 'ms" cx="' + r1(x) + '" cy="' + r1(y) + '" r="' + rb + '" fill="' + mix(c, 26, 'var(--bg)') + '" stroke="' + c + '" stroke-width="1.7"/>' +
      '<text class="b" x="' + r1(x) + '" y="' + r1(y + 4) + '" text-anchor="middle" style="font-size:' + (peq ? 10.5 : 12) + 'px">' + u + '</text>' +
      '<text class="v hal t13" x="' + r1(x) + '" y="' + r1(ac ? y - rb - 7 : y + rb + 16) + '" text-anchor="middle">' + (peq ? nf(b, 1) : pc(b)) + '</text>' +
      '<text class="n" x="' + r1(x) + '" y="' + yT + '" text-anchor="middle">' + (peq ? nf(uFCm[u], 1) : pc(uFCm[u])) + '</text><text class="n" x="' + r1(x) + '" y="' + (yT + 18) + '" text-anchor="middle">' + (peq ? nf(trunc2(D.disp_us_mes[u]), 2) : pc(trunc2(D.disp_us_mes[u]), 2)) + '</text>' +
      '<rect data-u="' + u + '" x="' + r1(x - bw / 2) + '" y="' + (top - 26) + '" width="' + r1(bw) + '" height="' + (H - top + 26) + '" fill="transparent"/>'; });
  el.innerHTML = s + '</svg>';
  Array.prototype.forEach.call(el.querySelectorAll('rect[data-u]'), function(r){ liga(r, function(ev){ var u = r.getAttribute('data-u');
    showTip(ev, '<div class="h">' + u + ' · ' + nf(D.cap_mw[u], 3) + ' MW · ' + nf(D.placa[u], 2) + ' MWp</div><table><tr><td>' + L('PR nos dias sem corte','PR, days w/o curtailment','无限电日 PR') + '</td><td>' + pc(D.pr_us_livre[u]) + '</td></tr><tr><td>' +
      L('PR publicado do mês','Published month PR','本月公布 PR') + '</td><td>' + pc(D.pr_us_mes[u]) + '</td></tr><tr><td>' + L('Fator de capacidade do mês','Month capacity factor','本月容量系数') + '</td><td>' + pc(uFCm[u]) + '</td></tr><tr><td>' +
      L('Fator de capacidade do dia','Day capacity factor','当日容量系数') + '</td><td>' + pc(uFC[u]) + '</td></tr><tr><td>' + L('Disponibilidade do mês','Month availability','本月可用率') + '</td><td>' + pc(trunc2(D.disp_us_mes[u]), 2) + '</td></tr><tr><td>' +
      L('Geração no dia','Day generation','当日发电量') + '</td><td>' + nf(uDia[u]) + ' MWh</td></tr></table>'); }); });
}

function tudo(){ FALTA = 0; textos(); gDia(); gArcos(); gLeque(); gPonte(); gMes(); gUsinas(); sparks(); RAIZ.setAttribute('data-zh-falta', FALTA); RAIZ.setAttribute('data-ok', LANG + ':' + TEMA + ':' + EST); }
tudo();
/* modo foto: a altura da página depois de a fonte embutida carregar (o tela.py lê para tirar a imagem e o PDF de página única) */
if (FOTO && document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ RAIZ.setAttribute('data-h', Math.ceil(document.body.getBoundingClientRect().height)); });
setTimeout(function(){ $('pg').classList.remove('anim'); }, 3200);
var tm, lw = innerWidth; addEventListener('resize', function(){ if (innerWidth === lw) return; lw = innerWidth; clearTimeout(tm); tm = setTimeout(function(){ $('pg').classList.remove('anim'); gDia(); gArcos(); gLeque(); gPonte(); gMes(); gUsinas(); sparks(); }, 120); });
function lingua(l){ LANG = l; try { localStorage.setItem('bolLang', l); } catch (e) {} $('pg').classList.remove('anim'); tudo(); }
function tema(t){ TEMA = t; try { localStorage.setItem('bolTema', t); } catch (e) {} RAIZ.setAttribute('data-theme', t); $('pg').classList.remove('anim'); tudo(); }
$('b-pt').addEventListener('click', function(){ lingua('pt'); }); $('b-en').addEventListener('click', function(){ lingua('en'); });
$('b-zh').addEventListener('click', function(){ lingua('zh'); });
$('b-tema').addEventListener('click', function(){ tema(TEMA === 'dark' ? 'light' : 'dark'); });
})();
